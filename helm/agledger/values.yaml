## AGLedger Helm Chart — Default Values

# ---
# OpenShift
# ---
# Set this on OpenShift (or any cluster admitting pods with `MustRunAsRange`).
# It drops the pod-level uid/gid REQUEST from every pod the chart creates (the
# api and worker Deployments, the migrate Job, and on the external-database
# path the runtime-role gate Job), letting the platform assign one instead:
#
#   helm install agledger oci://registry-1.docker.io/agledger/agledger-chart \
#     --set openshift.enabled=true --values your-values.yaml
#
# Why it is needed. OpenShift's default `restricted-v2` SCC gives each namespace
# a uid range (the `openshift.io/sa.scc.uid-range` annotation) and admits pods
# with `MustRunAsRange`. The stock `podSecurityContext` below asks for uid/gid
# 65532, outside that range on essentially every cluster, so a stock install is
# rejected at admission with:
#
#   unable to validate against any security context constraint:
#   runAsUser: Invalid value: 65532: must be in the ranges: [1000700000, ...]
#
# The image supports an arbitrary uid: it declares USER 65532 for plain
# Kubernetes and Docker, but nothing in it is owned by or hardcoded to that uid.
# Files are world-readable and it needs no passwd entry, so it runs correctly
# under an assigned uid with gid 0. Measured against the shipped image under the
# container constraints restricted-v2 imposes (arbitrary uid with gid 0,
# read-only root filesystem, all capabilities dropped, no-new-privileges):
# migrations apply, the API boots healthy, the discovery surfaces serve, a
# platform key mints, and a record notarizes. Admission itself has not been
# exercised on a live OpenShift cluster; that half follows from the SCC rules.
#
# What is actually dropped is the whole pod-level block below, which is
# `runAsNonRoot: true` alongside the two uid/gid keys and the RuntimeDefault
# seccomp profile. Every container-level control is untouched on all three
# workloads: read-only root filesystem, no privilege escalation, all
# capabilities dropped.
#
# Non-root therefore still holds, but by a different guarantee. On OpenShift
# restricted-v2 enforces it directly, along with a default seccomp profile. Off
# OpenShift it rests on the image's own `USER 65532:65532`, which the kubelet no
# longer independently verifies. That is fine for the stock image and worth
# knowing if you point `image.repository` at a derived one.
#
# The bundled PostgreSQL follows the same rule for the same reason. Its pod-level
# block asks for uid/gid 70, the `postgres` user in the upstream image, which is
# outside the namespace range exactly as 65532 is; this flag drops that block too
# and leaves restricted-v2 to assign one. Its container-level controls (read-only
# root filesystem, no privilege escalation, all capabilities dropped) are
# untouched, as they are everywhere else.
#
# `-f values-openshift.yaml` sets exactly this flag and nothing else. Prefer
# `--set` when installing straight from the OCI registry, since reaching the
# values file means pulling and untarring the chart first.
openshift:
  enabled: false

image:
  repository: agledger/agledger
  tag: ""  # defaults to appVersion
  # Pin by content hash for production. When `digest` is set the rendered image
  # reference is `repository@sha256:...` and `tag` is purely cosmetic. Digest
  # pinning bypasses kubelet's tag-name cache: with `pullPolicy: IfNotPresent`
  # (the default below), a node that previously pulled ANY image under the
  # same tag will NOT re-pull on the next deploy — your pod can boot against
  # a stale layer while ECR/Docker Hub serve a newer one under the same tag.
  # Pinning by digest makes the cache key the bytes you actually want, so
  # silent rollbacks are impossible.
  #
  #   image:
  #     repository: agledger/agledger
  #     tag: "X.Y.Z"  # cosmetic; ignored when digest is set
  #     digest: "sha256:<the digest you cosign-verified>"
  #
  # Look up + verify the current digest via:
  #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     --certificate-identity-regexp '^https://github.com/agledger-ai/agledger-api/.+@refs/tags/v.+$' \
  #     agledger/agledger:<tag>
  #   docker buildx imagetools inspect agledger/agledger:<tag>   # to read the digest
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []  # For private registries (ECR, GCR): add imagePullSecrets here

# ---
# API Service
# ---
# Sizing guidance:
#   Single-node clusters (e.g. one t3.medium = 2 vCPU): keep `strategy.type: Recreate`
#     and the resource defaults below — combined api+worker requests fit in 2 vCPU.
#   Multi-node / HA: switch `strategy` to `RollingUpdate`, set `replicaCount: 2+`,
#     enable autoscaling, and bump resources. RollingUpdate creates new pods before
#     terminating old ones, so the cluster needs ~2x per-pod CPU/memory headroom
#     during a rollout. On a single 2 vCPU node this fails to schedule and
#     `helm upgrade` hangs.
# Node 24 Permission Model runtime hardening (--permission, stable in Node 24).
# Applied to every container in the release that runs an entry script: the API
# and worker Deployments, and the migration and preflight Jobs. Denies
# filesystem WRITES, child processes, worker threads, native addons, WASI, and
# the inspector — the primitives a compromised npm dependency reaches for.
# Network is NOT gated by Node's permission model, so listeners + outbound
# webhook/JWKS/federation calls are unaffected. All four boot verified-clean
# under this profile; the two Jobs only read.
#
# Turning this off is not only a loss of sandbox. NODE_OPTIONS reaches every
# node process in a container, and Node refuses `--allow-fs-write` from one not
# started with `--permission`, so with `enabled: false` a NODE_OPTIONS in
# `extraEnv` or `migrate.extraEnv` fails its container at pre-execution. Widen
# the sandbox through extraAllowArgs below rather than through NODE_OPTIONS.
permission:
  enabled: true
  # Extra node --allow-* args appended to the argv of all four. Use to widen
  # the sandbox for opt-in features that need a denied capability, e.g.:
  #   - "--allow-fs-write=/var/log/agledger"   # file SIEM sink (SIEM_FILE_ENABLED)
  # The file sink is written by the WORKER only: it is the process that drains
  # the shared SIEM cursor to the push sinks, and the API serves the pull
  # channel (GET /v1/siem/stream) without touching the filesystem. With
  # worker.replicaCount above 1 the feed is split across the pods' files and
  # neither is complete; use the HTTP sink there, which is one collector.
  extraAllowArgs: []

api:
  replicaCount: 1
  # Recreate is the safe default for single-node clusters. Switch to RollingUpdate
  # once you have multiple nodes (or a node large enough to host both old and new
  # pods simultaneously).
  #
  # Either way an upgrade runs two releases against one schema: the migration is
  # a pre-upgrade hook Job, so it finishes while the pods you are leaving are
  # still serving. Recreate holds that window to the pod swap; RollingUpdate
  # stretches it across the whole rollout, with pods of both releases answering
  # this Service at once. Within a major, migrations are written to serve the
  # previous release, so nothing has to be ordered around it, but a security
  # control a release introduces binds only the pods carrying that release.
  # Read connectedVersions on GET /v1/admin/system-health to see which versions
  # are still attached.
  # deploy/README.md, "Two releases against one schema".
  strategy:
    type: Recreate
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: "1"
  # Rolling restarts behind a load balancer: pod endpoint removal and
  # ALB target deregistration are asynchronous, so without a preStop delay the
  # old pod starts shutting down while the ALB is still routing to it (a hard
  # window of timeouts then 502/503 that `kubectl rollout status` never sees).
  # The sleep keeps the container fully serving while deregistration
  # propagates; SIGTERM (and the app's in-flight drain) comes after. Rendered
  # ONLY when strategy.type is RollingUpdate: under Recreate there is no
  # traffic handoff to drain and the sleep would just lengthen the outage.
  # Set 0 to disable.
  preStopSleepSeconds: 15
  # Must cover preStopSleepSeconds + the app's own graceful shutdown (25s, from
  # config.server.shutdownTimeout) + 5s headroom, or the kubelet SIGKILLs
  # mid-drain. This is enforced: `agledger.assertApiGracePeriodFitsDrain` in
  # _helpers.tpl refuses to render a value that does not fit, because nothing in
  # the rendered manifest shows that the preStop sleep burns inside this number.
  #
  # 90 is well above the 45 that arithmetic strictly requires, and the headroom
  # is close to free: this is a MAXIMUM wait, not a delay. A pod with nothing in
  # flight terminates in well under a second either way, and the extra is spent
  # only on a pod that is genuinely stuck. Sizing it tight buys a faster drain
  # of a broken pod at the price of severing a healthy one's work.
  #
  # Under the default Recreate strategy no preStop sleep is rendered, so the
  # process gets the full 90s; under RollingUpdate it gets 90 - 15 = 75s.
  terminationGracePeriodSeconds: 90
  nodeSelector: {}
  tolerations: []
  affinity: {}
    # Recommended for HA: spread API pods across nodes
    # podAntiAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #     - weight: 100
    #       podAffinityTerm:
    #         labelSelector:
    #           matchExpressions:
    #             - key: app.kubernetes.io/component
    #               operator: In
    #               values: [api]
    #         topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  # Also the pod-level block for the migrate, preflight and backup workloads:
  # each of those reads `api.podSecurityContext`, so one edit here moves all of
  # them together and none of them can drift.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    # The syscall filter the Pod Security Standards' `restricted` profile
    # requires. Without it the kubelet runs the container `Unconfined`, which
    # leaves the whole syscall table reachable from inside it. RuntimeDefault is
    # the container runtime's own profile (containerd and CRI-O ship the same
    # blocklist), so it costs nothing on a normal workload and a namespace
    # labelled `pod-security.kubernetes.io/enforce: restricted` rejects the pod
    # without it. Set `seccompProfile: null` here to run Unconfined.
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ---
# Worker Service
# ---
# See `api` above for sizing guidance — same single-node vs. HA tradeoff applies.
worker:
  replicaCount: 1
  # Same Recreate default and the same mixed-release window as `api.strategy`
  # above. The worker's own share of it: pg-boss schedules live in the database,
  # so a worker on the older release meets jobs the newer release's schedule
  # minted, fails them rather than completing them, and counts them on
  # agledger_maintenance_unknown_task_total.
  strategy:
    type: Recreate
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: "1"
  healthPort: 3001
  nodeSelector: {}
  tolerations: []
  affinity: {}
    # Recommended for HA: spread worker pods across nodes
    # podAntiAffinity:
    #   preferredDuringSchedulingIgnoredDuringExecution:
    #     - weight: 100
    #       podAffinityTerm:
    #         labelSelector:
    #           matchExpressions:
    #             - key: app.kubernetes.io/component
    #               operator: In
    #               values: [worker]
    #         topologyKey: kubernetes.io/hostname
  topologySpreadConstraints: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    # See `api.podSecurityContext` above for what this is and how to turn it off.
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  pdb:
    enabled: false
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# ---
# Pre-install/pre-upgrade migration Job
# ---
migrate:
  # Defaults to api.resources. Override here if migrations need different limits.
  resources: {}
  # Scheduling constraints for the migration pod. Each empty value falls back
  # to the matching api.* value, so a cluster where the API is pinned to a
  # node class (arch, taints) schedules the migration pod the same way. On the
  # external-DB path this Job is a pre-install/pre-upgrade hook: a migration
  # pod that cannot schedule (or lands on an incompatible arch and crashes)
  # fails the whole helm install/upgrade, so keep these aligned with wherever
  # the image can actually run.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Environment for the migration pod ONLY. Deliberately NOT a fallback to the
  # top-level `extraEnv`: every knob below is read by dist/src/db/migrate.js and
  # by nothing else, so routing them through the shared list would set variables
  # on the api and worker pods that are inert there, and would make the reverse
  # true too — every runtime knob an operator adds for the API would land on a
  # Job that only runs DDL. Two lists, each carrying what its workload reads.
  # (The Job does still get the release ConfigMap and Secret via envFrom; this
  # is about the operator-supplied list, not about withholding credentials the
  # migrator needs.)
  #
  # Sizing a maintenance window is the reason this exists. A migration that adds
  # a column and builds an index in one transaction holds ACCESS EXCLUSIVE on
  # the table until COMMIT (the ALTER TABLE takes it; a plain CREATE INDEX on
  # its own would take the weaker SHARE), so reads as well as writes stop for
  # the whole file. The header of the migration in question is where the
  # numbers live — read it before picking values. Defaults (the first four are
  # applied by applySessionSafety at the start of the run; the last is read by
  # assertNoInvalidIndexes at the end of it):
  #
  #   MIGRATION_STATEMENT_TIMEOUT       15min  raise past your expected index
  #                                            build time, or the migration
  #                                            aborts. It rolls back cleanly,
  #                                            and what you see next depends on
  #                                            the path: external-DB upgrade,
  #                                            the hook fails and the previous
  #                                            version keeps serving;
  #                                            external-DB fresh install, no
  #                                            pods are created at all; bundled
  #                                            PG, nothing gates api/worker (the
  #                                            Job is a normal resource there),
  #                                            so they start and crashloop until
  #                                            you retry with a larger value
  #   MIGRATION_LOCK_TIMEOUT              30s  how long to wait FOR the lock
  #   MIGRATION_IDLE_IN_TX_TIMEOUT       5min  idle sessions only; an executing
  #                                            index build is not idle
  #   MIGRATION_MAINTENANCE_WORK_MEM   (unset) shortens the window rather than
  #                                            permitting a longer one. Postgres
  #                                            takes it PER maintenance
  #                                            operation, so a value sized for a
  #                                            large install can OOM a small
  #                                            containerised PG. Set it
  #                                            deliberately or leave it alone.
  #   AGLEDGER_ALLOW_INVALID_INDEXES   (unset) "true" starts anyway when an
  #                                            invalid index is present, instead
  #                                            of refusing. Recovery lever, not
  #                                            a steady-state setting.
  #
  # extraEnv:
  #   - name: MIGRATION_STATEMENT_TIMEOUT
  #     value: "60min"
  #   - name: MIGRATION_MAINTENANCE_WORK_MEM
  #     value: "256MB"
  #
  # DATABASE_URL is refused here on the managed paths, and it is the one knob
  # people reach for: the Job already receives it from the chart's Secret
  # through envFrom, so a second entry of the same name is two channels
  # supplying one variable with nothing in the render saying which wins. Point
  # the migration at its own role with `secrets.databaseUrlMigrate` instead,
  # which is the supported single channel and is injected on this Job only.
  extraEnv: []
  # Same shape as the top-level extraEnvFrom: load every key of a Secret or
  # ConfigMap. The Job already picks up the release ConfigMap and Secret, so
  # this is for env you keep in an object of your own.
  #
  # That object must ALREADY EXIST in the namespace. On the external-DB path
  # this Job is a pre-install/pre-upgrade hook, and Helm creates hooks before
  # every normal resource in the release — so an object created by this same
  # release (an umbrella chart's sibling Secret, say) is not there yet when the
  # Job runs. The pod then sits in CreateContainerConfigError, burns
  # backoffLimit, and fails the install. `helm template` and `helm lint` both
  # pass, so this only shows up at install time. Add `optional: true` to the
  # ref if you would rather the Job start without it than not start at all.
  extraEnvFrom: []

# ---
# Database (PostgreSQL)
# ---
database:
  externalUrl: ""  # required if postgres.bundled.enabled is false, and it WINS
                   # over postgres.bundled.enabled when both are set: the chart
                   # renders no bundled PostgreSQL, and the release is an
                   # external-database one in every other respect too (hook
                   # migration, runtime-role preflight gate, outbound database
                   # egress, and no ALLOW_DB_WITHOUT_SSL, so the production
                   # database TLS requirement stands: sslmode must be require,
                   # verify-ca or verify-full, and uselibpqcompat=true needs an
                   # sslrootcert beside it or the driver encrypts without
                   # verifying the certificate). See postgres.bundled.enabled.
                   # IMPORTANT: the role that runs MIGRATIONS (this URL, or
                   # secrets.databaseUrlMigrate if set) must be a SUPERUSER —
                   # rds_superuser on Amazon RDS/Aurora, a true superuser on
                   # self-managed PostgreSQL. The schema installs an event
                   # trigger (agledger_block_audit_drop, which blocks dropping
                   # the audit chain), and event triggers require superuser;
                   # object-ownership / CREATE privileges alone are NOT enough
                   # and the migration fails with "permission denied to create
                   # event trigger". The API/Worker role (this URL when
                   # databaseUrlMigrate is set) needs DML plus CREATE on the
                   # database (see the pg-boss note below), and must be NAMED
                   # agledger_app, unless it also owns the schema objects (one
                   # role migrating and serving carries every privilege by
                   # ownership). The migration grants DML to that exact role
                   # name, so a non-owner role called anything else receives no
                   # privileges at all and the API fails at boot with
                   # "permission denied for table ...". If your naming standard
                   # forbids it, make your role a member of that one after
                   # migrating:
                   #   GRANT agledger_app TO "your_role" WITH INHERIT TRUE;
                   # Spell out WITH INHERIT TRUE: PostgreSQL 16+ defaults that
                   # clause to the member role's own setting, so a NOINHERIT
                   # role receives nothing from a bare grant. Membership carries
                   # the privilege set the schema intends, including the
                   # append-only revokes that leave audit_vault insert-only and
                   # the ALTER DEFAULT PRIVILEGES that keep later migrations
                   # reachable. Do NOT substitute a blanket
                   # GRANT ... ON ALL TABLES IN SCHEMA public: it also hands the
                   # runtime role UPDATE and DELETE on audit_vault, which is the
                   # write the chain is protected against. If agledger_app does
                   # not exist, the migrating role could not create it and the
                   # schema granted nothing to anyone: grant your role USAGE on
                   # schema public, SELECT/INSERT/UPDATE/DELETE on all tables
                   # and the matching ALTER DEFAULT PRIVILEGES, then re-apply
                   # the append-only revokes. The preflight check names the role
                   # it connected as and reports both directions.
                   # Separately from anything the migration grants, the runtime
                   # role needs CREATE on the database:
                   #   GRANT CREATE ON DATABASE agledger TO agledger_app;
                   # pg-boss keeps its queue tables in a schema it installs on
                   # first start and the API starts pg-boss, so without this the
                   # API exits at boot with "permission denied for database
                   # ...". Creating the schema by hand does not substitute:
                   # pg-boss reads the absence of its own version table as "not
                   # installed" and issues CREATE SCHEMA IF NOT EXISTS
                   # regardless, which PostgreSQL refuses without the
                   # database-level privilege. The grant can be revoked after
                   # the first successful boot; later pg-boss upgrades stay
                   # inside the schema it owns by then.
                   # Both requirements are checked for you: on this path the
                   # chart runs a pre-install/pre-upgrade hook Job after
                   # migrating and before any workload starts, and a role that
                   # cannot serve fails the install with the grant named rather
                   # than leaving the API and Worker to crash-loop. Read its
                   # report by label (the Job's name is the release's fullname
                   # plus -preflight, so select rather than construct it):
                   #   kubectl logs -n <namespace> --tail=-1 \
                   #     -l app.kubernetes.io/instance=<release>,app.kubernetes.io/component=preflight
  poolMax: 20
  # Auto-rollback any idle-in-transaction backend that exceeds this many ms.
  # Closes the deadlock class where a stalled handler holds an advisory
  # lock indefinitely. 30s tolerates legitimate slow handlers while keeping
  # deadlock recovery within livez/readyz windows. Set to 0 to disable.
  # A whole number of milliseconds, no unit suffix: 30000, not "30s". Anything
  # else fails the render rather than casting to 0, which would disable the
  # guard silently.
  idleInTxTimeoutMs: 30000
  # Per-statement cap on app queries, in milliseconds, applied as
  # `SET statement_timeout` on every pooled connection.
  #
  # 0 (the default) does NOT mean "no cap": the API sends no SET, so every
  # session inherits the SERVER's statement_timeout — and postgres.bundled below
  # sets one. Pin a value here to be independent of the server. Same format
  # rules as idleInTxTimeoutMs: a whole number of milliseconds, no unit suffix.
  statementTimeoutMs: 0

postgres:
  bundled:
    # database.externalUrl takes precedence over this flag. With both set the
    # chart renders no bundled PostgreSQL at all, because honouring both breaks
    # the install: the Secret the chart writes carries the external DATABASE_URL
    # and no POSTGRES_PASSWORD, so the bundled Deployment asks for a Secret key
    # that was never written and sits in CreateContainerConfigError behind a PVC
    # you are billed for, while `helm install --wait` blocks on a database the
    # API never uses. Switching an existing bundled release to an external
    # database therefore drops the bundled PVC from the release, exactly as
    # setting this to false does, and on the default Delete reclaim policy that
    # takes the volume with it; back it up first if you want what is on it.
    #
    # The precedence is the same under secrets.existingSecret, where the chart
    # writes no Secret and reads no key out of yours: naming database.externalUrl
    # there still means this release runs no bundled PostgreSQL.
    enabled: false
    # Pinned by digest, the same reference the Compose bundled overlay pins.
    # A mirrored registry replaces the whole reference, digest included.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    # Server-side guards for the bundled instance, matched to what the Compose
    # bundled-PG overlay (deploy/compose/docker-compose.postgres.yml) already
    # sets, so the two bundled paths behave the same way. Without these the
    # bundled Helm Postgres ran stock: no statement cap and no idle-in-transaction
    # cap, where the Compose path had both.
    #
    # `statement_timeout` is the cap every app session inherits when
    # database.statementTimeoutMs is left at 0. The few engine statements that
    # cannot survive any cap (the partition-creation DDL and pg-boss's
    # CONCURRENTLY index builds) lift it
    # for themselves, so this bounds ordinary queries only. Rendered as
    # `postgres -c key=value`, sorted by key.
    parameters:
      idle_in_transaction_session_timeout: 300s
      log_statement: ddl
      shared_buffers: 256MB
      statement_timeout: 30s
    password: ""  # Empty = auto-generated 32-char random, preserved across upgrades (like apiKeySecret). Set to pin a specific password.
                  # This is the owner role's password, used by the migration Job (DATABASE_URL_MIGRATE)
                  # and backups. The API and worker connect as agledger_app under a password derived
                  # from it (AGLEDGER_APP_ROLE_PASSWORD), which the migration Job sets on every run, so
                  # the process serving requests does not own the audit chain's tables. The api and
                  # worker containers have POSTGRES_PASSWORD and DATABASE_URL_MIGRATE cleared, so they
                  # do not hold the owner credential either.
                  # Preservation reads the release Secret, which needs a real helm install: under a
                  # renderer it regenerates and stops matching what initdb set. See secrets.gitops.
    storage: 10Gi
    # storageClassName for the bundled-PG data PVC. Leave empty ("") to use the
    # cluster's DEFAULT storageclass. Bundled PG REQUIRES either a default
    # storageclass or an explicit value here — otherwise the PVC stays Pending
    # forever and the install hangs. Modern EKS (1.30+) ships NO default
    # storageclass (the in-tree gp2 default is gone; the EBS CSI addon does not
    # mark one default) — on EKS set this to your provisioner's class, e.g. "gp3".
    storageClassName: ""
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
    # uid/gid 70 is the `postgres` user in the upstream Alpine image. The image
    # declares no USER of its own and its entrypoint drops privileges itself, so
    # without this the pod runs the entrypoint as root. `fsGroup` is what makes
    # the mounted PVC writable by that uid; asking for the uid without it leaves
    # initdb failing on "Permission denied" against the data directory.
    #
    # Dropped wholesale on OpenShift, along with every other pod-level block in
    # this file, by `openshift.enabled` (see the note at the top).
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      fsGroup: 70
      seccompProfile:
        type: RuntimeDefault
    # `readOnlyRootFilesystem: true` holds here because the chart mounts the two
    # paths the server writes outside its data directory: /var/run/postgresql for
    # the Unix socket and lock file, and /tmp. Measured against the pinned image
    # above: initdb completes, the server starts, and it accepts connections.
    # Dropping either mount puts it back to "could not create lock file
    # /var/run/postgresql/.s.PGSQL.5432.lock: Read-only file system".
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# ---
# Instance id
# ---
# AGLEDGER_INSTANCE_ID: this Server's identity. Every external anchor key is
# written under `vault-anchors/<instanceId>/`, and with federation on it is the
# identity peers store (`peerHubId`, a UUID). Two releases on one id and one
# anchor bucket read each other's anchors.
#
# Empty generates a UUID on first install and keeps it: the chart writes it into
# its ConfigMap and reads it back with `lookup` on every upgrade, the way it
# keeps the generated values under `secrets`. A release whose ConfigMap exists
# but carries no id (installed by a chart that set none) keeps `default`, the
# prefix it has anchored under. The Server records the id it first boots with
# in its database and refuses a boot under a different one, naming both, so set
# this when the value cannot come from `lookup`:
#   - under a renderer (Argo CD, `helm template | kubectl apply`): secrets.gitops
#     refuses the render until this is pinned;
#   - with secrets.existingSecret and no ConfigMap to read back (a first install,
#     or any render that cannot see the cluster): the render refuses until this
#     is pinned. helm-install.sh mints one on such a first install, passes it,
#     and prints it to pin;
#   - a release restored from another release's backup: the post-restore Job
#     prints the database's id (POST_RESTORE_INSTANCE_ID), and this takes it;
#   - a release installed over a database whose ConfigMap is gone.
# Read the current value off the ConfigMap the api Deployment names:
#   kubectl get configmap -n <ns> "$(kubectl get deploy -n <ns> \
#     -l app.kubernetes.io/instance=<release>,app.kubernetes.io/component=api \
#     -o jsonpath='{.items[0].spec.template.spec.containers[0].envFrom[0].configMapRef.name}')" \
#     -o jsonpath='{.data.AGLEDGER_INSTANCE_ID}'
# A secrets.existingSecret carrying AGLEDGER_INSTANCE_ID overrides the
# ConfigMap's, because envFrom takes the later source.
instanceId: ""

# ---
# Extra environment (API + worker)
# ---
# Inject additional env vars into both workloads. The primary use is secrets
# CONSUMED BY PROVISIONING at boot — e.g. an HMAC webhook secret referenced from
# provisioning YAML as `secret: ${WEBHOOK_ACME_SECRET}` (substitution happens in
# the loader; provisioning runs on the API pod). The chart-managed Secret below
# only carries the engine's own keys, so bring webhook/integration secrets here,
# ideally by reference to an operator-managed (or External-Secrets-synced) Secret
# rather than inline plaintext.
#
# FEDERATION keys are configured here too. The Server's federation identity
# is not: it is AGLEDGER_INSTANCE_ID, which `instanceId` below supplies, and the
# render refuses an extraEnv entry of that name. `GET
# /federation/v1/admin/instance` reports `configured: false` and names every
# missing piece until both federation keys are set.
#
# DATABASE_URL is not settable here on the managed paths: the chart's own
# Secret already supplies it to every workload through envFrom, and a second
# entry of the same name would win silently. The render refuses instead. Point
# the release at another database with `database.externalUrl`, or at another
# role for the migration with `secrets.databaseUrlMigrate`.
extraEnv: []
  # - name: WEBHOOK_ACME_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: agledger-webhook-secrets
  #       key: acme

# ---
# Extra volumes on the API, worker, migration and preflight pods
# ---
# For settings that take a FILE PATH rather than a value. `extraEnv` sets the
# variable; these put the file where it points. Without them, three of the four
# /llms.txt customization knobs were unreachable on Kubernetes: they name a path
# and the chart had no way to deliver one, so the env var pointed at nothing, the
# Server fell back to the built-in template, and the only evidence was a WARN
# plus agledger_llms_txt_customization_load_failures_total. The Compose path
# says "mount the files into the container" and could; this one could not.
#
# Rendered on both workloads, so a file the API reads is also present for the
# worker rather than being half-configured. Also rendered on the migration and
# preflight Jobs, which connect to the database with the same config: a private
# CA bundle mounted here for `config.nodeExtraCaCerts` has to reach them too, or
# an `sslmode=verify-full` database refuses the migration. Those Jobs are
# pre-install hooks on an external database, so anything a volume names (a
# ConfigMap, a Secret) must exist before `helm install`, not be created by it.
#
# Serving a customized /llms.txt, end to end:
#
#   kubectl create configmap agledger-llms-txt \
#     --from-file=prepend.md --from-file=append.md
#
#   extraVolumes:
#     - name: llms-txt
#       configMap:
#         name: agledger-llms-txt
#   extraVolumeMounts:
#     - name: llms-txt
#       mountPath: /etc/agledger/llms-txt
#       readOnly: true
#   extraEnv:
#     - name: AGLEDGER_LLMS_TXT_PREPEND_PATH
#       value: /etc/agledger/llms-txt/prepend.md
#     - name: AGLEDGER_LLMS_TXT_APPEND_PATH
#       value: /etc/agledger/llms-txt/append.md
#
# AGLEDGER_LLMS_TXT_OVERRIDE_PATH replaces the generated document entirely. Read
# what it costs before using it: the Server serves that file verbatim and never
# regenerates, so it does not follow the API across releases. It is the one knob
# that can make the discovery surface disagree with the build serving it.
extraVolumes: []
extraVolumeMounts: []
# Load every key of a Secret/ConfigMap as env, cleanest when you have several
# provisioning secrets at once.
#
# On the external-database path these two lists reach one more pod than the
# api/worker Deployments: the runtime-role gate below, which is a pre-install
# hook and so runs before Helm creates any normal resource in the release. It
# carries them because either can hold the TLS or connection env the Server
# talks to the database with, and a gate that connects differently from the
# workload proves nothing. The consequence is that a Secret or ConfigMap
# referenced here (or by a `valueFrom` in extraEnv) must ALREADY EXIST in the
# namespace: one created by this same release, such as an umbrella chart's
# sibling Secret, is not there yet when the hook runs, and the pod sits in
# CreateContainerConfigError until the install times out. `helm template` and
# `helm lint` both pass, so this only shows up at install time. Add
# `optional: true` to the ref if you would rather the gate start without it.
extraEnvFrom: []
  # - secretRef:
  #     name: agledger-webhook-secrets

# ---
# Secrets
# ---
secrets:
  # Set this to true when something OTHER than helm applies the chart: Argo CD,
  # or any pipeline built on `helm template | kubectl apply`.
  #
  # The three values below that the chart generates (apiKeySecret,
  # postgres.bundled.password, metricsAuthToken) are preserved across upgrades
  # by reading the release Secret with `lookup`. `lookup` talks to the API
  # server, and a renderer does not: under `helm template` it returns nothing,
  # every sync falls through to the random fallback, and the Secret is applied
  # with brand new values. Every API key issued against the last API_KEY_SECRET
  # stops authenticating, the bundled-PostgreSQL password stops matching the one
  # initdb set, and the Prometheus you configured starts getting 401s. Nothing
  # logs a rotation, because from the chart's side nothing was rotated.
  #
  # There is no in-template flag that says "this is a render, not an install":
  # .Release.IsInstall is true under `helm template` too. So this is a value you
  # set, and it turns each of those three fallbacks into a render failure naming
  # what to supply instead.
  #
  # The supported GitOps path is secrets.existingSecret: a Secret your platform
  # manages (External Secrets, Sealed Secrets, SOPS). With it set the chart
  # writes no Secret at all and has nothing to rotate.
  #
  # Flux's helm-controller runs real helm releases against the cluster, so
  # `lookup` works there and this can stay false.
  gitops: false
  apiKeySecret: ""          # Auto-generated if empty (64-char random). Preserved across upgrades
                             # by reading the release Secret, which needs a real install: see
                             # secrets.gitops above before syncing this chart from a renderer.
                             # A pinned value must be 32 characters or more: the Server refuses
                             # to boot in production on anything shorter.
  vaultSigningKey: ""       # Ed25519 key for audit vault signatures. Generate with:
                             #   kubectl run keygen --rm -it --restart=Never \
                             #     --image=agledger/agledger:<same tag this chart deploys> \
                             #     --command -- /nodejs/bin/node dist/scripts/generate-signing-key.js
                             # --command is required: it replaces the image's
                             # ENTRYPOINT instead of appending to it.
                             # Install without this value set and the chart
                             # prints the same command with the image already
                             # filled in. Add --algorithm es256 for FIPS hosts.
                             # Preserved across upgrades once set.
  webhookEncryptionKey: ""  # optional. When set, held to the same 32-character floor as apiKeySecret
  webhookEncryptionKeyPrevious: ""  # optional. The previous WEBHOOK_ENCRYPTION_KEY after a rotation; stored secrets are re-encrypted under the current key on their next delivery
  # Bearer token for GET /metrics. Auto-generated (48 chars) if empty and
  # preserved across upgrades, so the ServiceMonitor and the Prometheus you
  # pointed at this install keep scraping. Read it with:
  #   kubectl get secret -n <ns> -l app.kubernetes.io/instance=<release> \
  #     -o jsonpath='{.items[0].data.METRICS_AUTH_TOKEN}' | base64 -d
  # Set to "-" to mint none, which leaves /metrics behind the ordinary API-key
  # chain in production (METRICS_AUTH_REQUIRED defaults true there).
  # Preserved the same way apiKeySecret is, and lost the same way under a
  # renderer: see secrets.gitops above.
  metricsAuthToken: ""
  databaseUrlMigrate: ""    # optional — superuser DATABASE_URL for migrations (DDL).
                             # When set, the migration job uses this instead of the
                             # standard DATABASE_URL. Enables DB role separation:
                             # a SUPERUSER for DDL (migrations — see the event-trigger
                             # note on database.externalUrl: rds_superuser on RDS/Aurora,
                             # superuser on self-managed PG), agledger_app for DML
                             # (API/Worker). AGLEDGER_APP_ROLE_PASSWORD on the migrate
                             # Job (migrate.extraEnv, or the existingSecret key below)
                             # gives agledger_app its login under that password on
                             # every migration, so this URL names the owner and
                             # database.externalUrl names agledger_app with it.
  databaseUrlDirect: ""     # optional — a connection string that bypasses a
                             # connection pooler running in transaction mode
                             # (PgBouncer pool_mode=transaction, RDS Proxy).
                             # Required when DATABASE_URL points at one: the API
                             # and Worker refuse to boot otherwise, because the
                             # LISTEN client, the session-level advisory locks
                             # and migrations all need a session that stays
                             # theirs. Leave empty for a direct database or a
                             # pooler in session mode, and everything runs on
                             # DATABASE_URL as before. On RDS, this is the
                             # instance or cluster endpoint rather than the
                             # proxy endpoint.
  # The Developer Edition key from agledger.ai/register is a compact string
  # (agl_dev_v1_...), and that is the format to put here. `licenseKey` below is
  # the older PEM file contents; set one or the other, not both.
  # Precedence, highest first: license, license.keyFile, licenseKey.
  license: ""               # optional. Compact activation string (AGLEDGER_LICENSE)
  licenseKey: ""            # optional. Inline PEM license string (AGLEDGER_LICENSE_KEY)
  apiKeySecretPrevious: ""  # optional. The previous API_KEY_SECRET, honoured beside the current one while keys are re-hashed. A chart-managed Secret change rolls both Deployments; with existingSecret, restart them yourself
  # optional — the vault signing key this install has stopped signing with.
  # Registered as retired so GET /v1/verification-keys keeps publishing it and
  # everything it signed stays verifiable offline. Its window is derived from
  # the chain, so history under it does not fall outside it.
  #
  # Changing the signing key is two steps and this chart covers the first: set
  # secrets.vaultSigningKey to the new key and upgrade. The checksum annotations
  # on both pod templates roll the api and the worker, each process registers
  # the key it holds and starts signing with it, and the old key stays active
  # until you retire it with
  # POST /v1/admin/vault/signing-keys/{keyId}/retire. deploy/README.md has both
  # orders (scheduled and compromise).
  vaultSigningKeyPrevious: ""
  existingSecret: ""        # set to use a pre-existing Kubernetes Secret
                             # With this set the chart writes no Secret and cannot
                             # see what is in yours, so nothing here notices when
                             # you change a value in it: RESTART BOTH DEPLOYMENTS
                             # YOURSELF after every change
                             # (kubectl rollout restart deploy -n <ns>
                             #  -l app.kubernetes.io/instance=<release>,
                             #  which restarts both without depending on
                             #  the rendered workload names).
                             # That matters most for
                             # VAULT_SIGNING_KEY: a process that never restarts
                             # goes on signing with the key it booted with.
                             # The Secret must contain these keys (as env var names):
                             #   DATABASE_URL          (required) — PostgreSQL connection string
                             #   API_KEY_SECRET        (required) — HMAC key for API key hashing
                             #   VAULT_SIGNING_KEY     (required unless signing.kmsKeyArn is set) — Ed25519 key
                             #     for audit vault signatures
                             #   VAULT_SIGNING_KEY_PREVIOUS (optional): during a key change,
                             #     the key the running pods sign with. The first pod on the
                             #     new key signs the succession that admits it with both
                             #     keys; remove it once the old key is retired
                             #   WEBHOOK_ENCRYPTION_KEY (optional) — AES key for webhook payloads
                             #   DATABASE_URL_MIGRATE  (optional) — Owner-role URL for migrations
                             #   DATABASE_URL_DIRECT   (optional) — pooler-bypassing URL for
                             #     LISTEN, session advisory locks and migrations
                             #   AGLEDGER_APP_ROLE_PASSWORD (optional): the migration Job
                             #     gives agledger_app a login under it, CREATE on the
                             #     database and the pg-boss schema, on every run. Set it
                             #     with DATABASE_URL naming agledger_app and
                             #     DATABASE_URL_MIGRATE naming the owner, so the API does
                             #     not serve as the role that owns the audit chain.
                             #   AGLEDGER_LICENSE      (optional): compact key, agl_<tier>_v1_...
                             #   AGLEDGER_LICENSE_KEY  (optional) — PEM license string
                             #   METRICS_AUTH_TOKEN    (optional) — bearer token for GET /metrics.
                             #     The chart mints one into its own Secret and cannot write to
                             #     yours, so supply it here if you want a bearer-token scrape.
                             #     Required if you enable monitoring.serviceMonitor, which
                             #     references this key: without it the Prometheus Operator
                             #     cannot resolve the selector and drops the scrape config.
                             #     Without it /metrics answers the API-key chain instead
                             #     (METRICS_AUTH_REQUIRED defaults true in production).

# ---
# License (Developer Edition or Enterprise)
# ---
# A license is required to run AGLedger in production, and the Developer Edition
# key is free: register at https://agledger.ai/register. With no key at all this
# deployment is Unlicensed Use, not Developer Edition: permitted for evaluation,
# development and testing only, and only for the Evaluation Period the license
# sets (https://agledger.ai/license, section 2.5).
# Everything fails open. No key configured, or a key that was removed, logs a WARN
# banner every 24h; a key that fails validation logs an ERROR every 30 minutes.
license:
  releaseDate: ""           # YYYY-MM-DD — baked into image at build time; override only if building from source
  keyFile:
    enabled: false          # Mount a PEM license file from a K8s Secret
    secretName: ""          # Name of the K8s Secret containing the license PEM
    secretKey: license.pem  # Key within the Secret
    mountPath: /run/secrets/agledger-license  # Directory inside the container; the
                             # file lands at <mountPath>/<secretKey>. A directory
                             # mount is what lets a rotated Secret reach
                             # POST /v1/admin/license/reload without a pod restart.

# ---
# AWS Marketplace — alternative license source via License Manager
# ---
marketplace:
  productId: ""              # AWS Marketplace product ID (prod-…) — enables Marketplace licensing
  publicKeyVersion: ""        # Key version for CheckoutLicense (default: SDK default)
  # IAM role for License Manager access (IRSA on EKS)
  serviceAccountAnnotations: {}
  # Example:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/agledger-marketplace

# ---
# Vault signing key custody
# ---
# By default the chart holds the vault signing key as key material in its
# Secret (secrets.vaultSigningKey). Set kmsKeyArn instead to sign with a key
# whose private half never leaves AWS KMS: the Server fetches the public half
# at boot, registers it like a local key, and makes one KMS Sign call per
# chain entry, checkpoint, Receipt, signed webhook delivery and certificate.
# With kmsKeyArn set the chart writes no VAULT_SIGNING_KEY and does not
# require secrets.vaultSigningKey; a key this install has signed with before
# goes in secrets.vaultSigningKeyPrevious for the upgrade that moves to KMS, so
# the first pod on the KMS key signs the succession that admits it.
#
# A vault key is trusted only when a signed statement links it to a key a pod
# holds. The database stores those statements and vouches for none of them,
# so a key changes by succession: set the new key with the old one as its
# predecessor (secrets.vaultSigningKeyPrevious, or previousKmsKeyArn for a
# KMS-held one), roll, then retire the old key from a pod on the new one. A pod
# whose key nothing links to the history signs nothing and reports
# signingKey.gate "unanchored".
#
# The key must be asymmetric, key spec ECC_NIST_P256, usage SIGN_VERIFY. KMS
# signs no Ed25519, so this is an ES256 chain: set
# config.allowNonDefaultSigningAlg: true and upgrade every consumer that
# verifies this chain (@agledger/verify 2.0.0 or newer). The pods reach
# KMS through IRSA: grant kms:GetPublicKey and kms:Sign on the key to a role
# and name it in serviceAccount.annotations.
#
# When KMS stops answering, a process refuses every write (503) rather than
# write unsigned, fails its readiness probe, and resumes on its own when a
# probe Sign is answered. deploy/monitoring/alerts ships the two rules.
signing:
  kmsKeyArn: ""             # arn:aws:kms:<region>:<account>:key/<id> (or :alias/<name>); region comes from the ARN
  kmsEndpoint: ""           # KMS endpoint override (a VPC endpoint); empty = the regional endpoint
  remoteMaxPerSecond: null  # Per-process ceiling on Sign calls (default 100). KMS Sign quotas are
                            # per account and region and shared with every caller, so the sum
                            # across api and worker replicas has to sit under the quota.
  previousKmsKeyArn: ""     # KMS-to-KMS key change: the KMS key the running pods sign with. It signs the
                            # succession admitting kmsKeyArn and nothing else; remove it once retired.
                            # The pods need kms:GetPublicKey and kms:Sign on it for the change.
  trustAnchors: ""          # Comma list of sha256:<hex> vault key pins the pods also trust. Recovery only:
                            # re-joins history no key in hand links to (a lost previous key, recovery
                            # after a leak). dist/scripts/signing-key-digest.js prints a pin.
  distrustedKeys: ""        # Comma list of sha256:<hex> pins of vault keys that leaked, each optionally
                            # @<RFC 3339 instant> for when: what the key signs from then (default: its
                            # retirement) counts for nothing, so a closure it signs stops cutting off the
                            # keys the pods hold. A forced retirement's response names the entry.

# ---
# Application Config
# ---
config:
  logLevel: info
  # Behind an ingress or load balancer, the addresses or CIDR blocks it connects
  # from ("10.0.0.0/8", or a comma list), so X-Forwarded-For is read only when a
  # proxy you run wrote it. Not true: that trusts every hop, the client writes
  # the first one, and API key allowedIps, rate-limit buckets and audit-row
  # addresses then read whatever the client sent. The Server warns at boot on it.
  trustProxy: false
  nodeEnv: production
  externalUrl: ""  # Public URL where this instance is reachable (e.g., https://agledger.example.com).
                    # The Server's published identity — the issuer (`iss`) signed into every
                    # record/receipt/cert. Cascades to the A2A agent card URL. Auto-derived
                    # from ingress.hosts[0] when ingress is enabled.
                    #
                    # PERMANENT. Rows already written keep the issuer they were signed with,
                    # so changing this later splits the chain into two issuers rather than
                    # correcting anything. With nodeEnv: production and neither this value nor
                    # an ingress host, the chart REFUSES to render rather than signing a
                    # default into that field. For a single node with no domain, set it to
                    # https://localhost yourself — that is a choice the chart will not make
                    # on your behalf.
                    #
                    # UPGRADING from a release that had no such requirement: your install
                    # already signed rows with something. Read it and set exactly that,
                    # rather than setting the public URL for the first time here:
                    #   kubectl -n NS get configmap RELEASE-agledger-chart \
                    #     -o jsonpath='{.data.AGLEDGER_EXTERNAL_URL}'
                    # Read it, do not guess it. An install with an ingress host has been
                    # signing that host all along; only one with no ingress and no route
                    # host fell back to https://localhost.
  otelProvider: "generic"
  # OTLP endpoint. Tracing and OTel metric export stay off until this is set,
  # and on Kubernetes this value is the only thing that turns them on.
  # It must be the BASE url of the collector's HTTP receiver (port 4318), with
  # no `/v1/...` suffix: this build exports OTLP over HTTP with a JSON body,
  # and the exporters append the per-signal path (`/v1/traces`, `/v1/metrics`)
  # themselves. A `:4317` value (that is the gRPC receiver) or one that already
  # carries a signal path still boots; the Server WARNs at startup naming the
  # fix, and nothing reaches the collector until it is corrected.
  # Rendered into the ConfigMap only when non-empty.
  #   otelExporterOtlpEndpoint: http://otel-collector.observability:4318
  # With the shipped networkPolicy on, setting this also opens egress from the
  # API and worker pods to any pod in the cluster on the endpoint's port (the
  # URL's own, else 443 for https and 4318 for http). A collector outside the
  # cluster, on a private address or on a public one at any port but 443,
  # still needs an egress entry of your own.
  otelExporterOtlpEndpoint: ""
  # Primary contract type for agent discovery docs (/llms.txt, /llms-full.txt).
  # Pick your primary use case so agents see it first; empty string uses the
  # first alphabetical active contract as a deterministic fallback.
  exampleType: ""
  rateLimitEnabled: true
  # RATE_LIMIT_STORE. Empty means the chart derives it from the replica shape:
  # `postgresql` when api.replicaCount > 1 or hpa.enabled (a shared counter, so
  # the advertised limit is the limit), `memory` on a single replica. Set
  # "memory" or "postgresql" to decide it yourself.
  rateLimitStore: ""
  # Key lifetime. Two separate knobs, both set through extraEnv.
  #
  # API_KEY_DEFAULT_LIFETIME_SECONDS is what an admin or agent key gets when the
  # mint names no expiresAt. It defaults to 7776000 (90 days) with no chart
  # value set, so a stock install does not issue permanent bearers; set it to
  # "0" to go back to non-expiring keys. It fills in only what the caller did
  # not ask for, so an explicit expiresAt further out still succeeds.
  # AGLEDGER_PLATFORM_KEY_DEFAULT_LIFETIME_SECONDS is the same for platform
  # keys and defaults to 0 (exempt): minting a platform key needs a platform
  # credential, so an install whose only one expires with no OIDC issuer mapped
  # to the platform role has locked itself out.
  #
  # API_KEY_MAX_LIFETIME_SECONDS is the ceiling, empty meaning no cap. A mint
  # asking for an expiresAt beyond it is refused with a 422 naming the ceiling
  # rather than clamped, and it applies to every role. With both set, a mint
  # that names no expiry gets the smaller of the two.
  #
  # Both bind BOTH doors: keys minted through the API and keys minted from the
  # provisioning directory, which re-opens the window on every reconcile for the
  # keys it manages. Find the keys that predate the policy with
  # GET /v1/admin/api-keys?neverExpires=true; the engine also reports the count
  # at boot.
  #   extraEnv:
  #     - name: API_KEY_DEFAULT_LIFETIME_SECONDS
  #       value: "7776000"
  #     - name: API_KEY_MAX_LIFETIME_SECONDS
  #       value: "7776000"
  corsEnabled: true
  helmetEnabled: true
  # Opt-in acknowledgment for a non-default vault signing algorithm (e.g. an
  # ES256 key on a FIPS-mode cluster). Chain consumers need
  # @agledger/verify 2.0.0 or newer. Maps to AGLEDGER_ALLOW_NON_DEFAULT_SIGNING_ALG.
  allowNonDefaultSigningAlg: false
  nodeExtraCaCerts: ""  # Path to CA bundle inside the container.
                         # For Aurora/RDS: /etc/ssl/certs/rds-global-bundle.pem (bundled in image)
                         # For Cloud SQL or private CAs: mount your cert and set the path here

# ---
# Ingress
# ---
ingress:
  enabled: false
  className: ""
  annotations: {}
  # AWS ALB example:
  #   kubernetes.io/ingress.class: alb
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/healthcheck-path: /health
  #
  # With target-type: ip, ALSO label the release namespace so the AWS Load
  # Balancer Controller injects its pod readiness gate:
  #   kubectl label namespace <ns> elbv2.k8s.aws/pod-readiness-gate-inject=enabled
  # Without it, a rolling update counts a new pod Ready as soon as the
  # readinessProbe passes, even though the ALB target is still registering:
  # the old pod is torn down before the new one receives traffic.
  # Pair with api.preStopSleepSeconds for the shutdown half of the same race,
  # and consider alb.ingress.kubernetes.io/target-group-attributes:
  #   deregistration_delay.timeout_seconds=30
  # so old targets drain promptly instead of holding the default 300s.
  # nginx example:
  #   kubernetes.io/ingress.class: nginx
  #
  # Required whenever enabled is true. An Ingress with no rules is rejected by
  # the API server, so the chart refuses that render rather than shipping an
  # object that fails on apply with the rest of the release already installed.
  # The first host also answers config.externalUrl when that is unset.
  hosts: []
  # `paths` is optional. A host on its own routes / as a Prefix, which is the
  # only route this chart serves, so the short form below is complete:
  #  - host: api.agledger.example.com
  # Write the list only to narrow or split the routing:
  #  - host: api.agledger.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  # Required whenever enabled is true, for the same reason `hosts` is: an
  # Ingress with no `tls` block is served over plain HTTP, and what crosses it
  # is API keys in an Authorization header and the record bodies they write.
  # The chart refuses that render rather than publishing the Server in the
  # clear, so an enabled ingress names a certificate here or says explicitly
  # that it does not want one via `allowPlainHttp` below. The OpenShift Route
  # path makes the same choice by default (`route.tls.enabled: true` with
  # `insecureEdgeTerminationPolicy: Redirect`), so the two agree.
  #
  # UPGRADING: a release that enables `ingress` with none of `tls`, an ALB
  # certificate annotation, or `allowPlainHttp` rendered before and does not
  # now. The render names which of the three to add. GKE's pre-shared or
  # managed-certificate annotations are not recognised as TLS by this chart, so
  # that arrangement is the `allowPlainHttp` case.
  tls: []
  #  - secretName: agledger-tls
  #    hosts:
  #      - api.agledger.example.com
  # The way out when TLS terminates in front of this Ingress and the controller
  # is genuinely reached over plain HTTP: a service mesh, or a cloud load
  # balancer holding the certificate and speaking HTTP to the cluster. It admits
  # nothing on its own, it only says the empty `tls` above is deliberate.
  #
  # An AWS ALB needs neither this nor `tls`: its
  # `alb.ingress.kubernetes.io/certificate-arn` annotation already says the load
  # balancer holds the certificate, and the chart reads it as TLS. GKE's
  # `ingress.gcp.kubernetes.io/pre-shared-cert` and
  # `networking.gke.io/managed-certificates` are not read that way, so a GKE
  # ingress terminating TLS at the load balancer is this flag's case.
  #
  # Because the stated case IS https at the front door, this also makes the
  # AGLEDGER_EXTERNAL_URL derived from the first ingress host https. That value
  # is the permanent issuer signed into every record, so set config.externalUrl
  # explicitly if this Server is genuinely published over plain HTTP.
  allowPlainHttp: false

# ---
# OpenShift Route
# ---
# The native OpenShift ingress object. Enable this OR `ingress` above, never
# both: the OpenShift router reconciles an Ingress into a Route of its own, so
# two objects would claim the same hostname and the chart refuses that render.
#
# Nothing here implies openshift.enabled — that flag is about pod admission and
# this one is about exposure — but a cluster that needs one usually needs both.
route:
  enabled: false
  # Omit to let the router generate <name>-<namespace>.<apps domain>. An empty
  # string is not the same thing: the router rejects it.
  host: ""
  path: ""
  annotations: {}
  #  haproxy.router.openshift.io/timeout: 60s
  tls:
    enabled: true
    # edge: the router terminates TLS and speaks plain HTTP to the pod, which is
    #   what the image serves. This is the working default.
    # reencrypt: the router re-encrypts to the pod, so the pod must serve TLS.
    #   The shipped image does not; use it only behind a sidecar or service mesh
    #   that does, and supply destinationCACertificate.
    # passthrough: the pod terminates TLS itself. Same requirement.
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    destinationCACertificate: ""

# ---
# Horizontal Pod Autoscaler
# ---
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# ---
# Backup
# ---
# The bundled PostgreSQL has no point-in-time recovery and no backup of its own.
# An external database (RDS/Aurora, Cloud SQL, Azure) has its provider's PITR,
# which is a better answer than anything this chart can run, so on that path
# treat the CronJob below as a portable second copy rather than the plan.
#
# The archive is the same shape scripts/restore.sh reads:
# backup-<UTC timestamp>.tar.gz holding <timestamp>/db.dump (pg_dump custom
# format) and <timestamp>/vault-public-keys.csv. Restore is documented in the
# install README; it is a kubectl recipe rather than a Job, because a restore
# has preflight questions (a superuser for the audit event trigger, the runtime
# role gate) that an operator has to answer rather than a template.
# `helm test` runs one Pod that curls /health. An air-gapped cluster points
# this at its registry's copy.
tests:
  image: curlimages/curl:8.18.0

backup:
  cronJob:
    enabled: false
    schedule: "0 2 * * *"   # UTC
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    backoffLimit: 2
    # startingDeadlineSeconds: 3600
  # A backup taken before `helm upgrade` runs migrations. Failing it aborts the
  # upgrade with nothing migrated, which is the point.
  preUpgrade:
    enabled: false
  # How many archives to keep on the PVC. Ignored under s3, where the bucket's
  # lifecycle policy owns expiry.
  keep: 7
  # A PostgreSQL client image: the AGLedger runtime base carries no pg_dump.
  # Defaults to postgres.bundled.image. pg_dump refuses a server newer than
  # itself, so an external PostgreSQL 18 needs an 18 client here.
  image: ""
  persistence:
    enabled: false
    existingClaim: ""
    size: 20Gi
    storageClassName: ""
    accessModes: [ReadWriteOnce]
  # Object storage instead of a PVC. Needs an image carrying BOTH pg_dump and
  # the aws CLI (set backup.image); no public image ships both, so this is a
  # build-one-image path, deliberately not a default that half-works. On EKS,
  # leave existingSecret empty and annotate the service account for IRSA.
  s3:
    enabled: false
    bucket: ""
    prefix: ""
    endpoint: ""        # for S3-compatible stores (MinIO, R2, Wasabi)
    existingSecret: ""  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION
  workDirSize: 8Gi
  resources: {}
  nodeSelector: {}
  tolerations: []

# ---
# Post-restore Job
# ---
# The steps restore.sh runs after the migration on a Compose install: re-apply
# the revocations made after the backup, write the restore marker the next boot
# turns into a RESTORE_EPOCH chain entry, and compare the external anchors
# against the restored database. They need the Server's whole configuration, so
# on a cluster they run here, in the api's image with the api's env, volumes and
# security context, rather than on the host that ran the restore.
#
# A CronJob that never fires (suspended, on a schedule that names February 31),
# so it runs only when started by hand: `kubectl create job --from=cronjob/...`.
# Its input is a Secret of the same name, which the runbook creates from the
# directory restore.sh writes; without it the Job exits 2 and names what is
# missing. restore.sh prints every command. Renders nothing that runs on its
# own, which is why it is on by default: an install that turns it off has to
# turn it back on before a restore, and a `helm upgrade` resets the Deployments'
# replica counts, which would start the Server before these steps.
postRestore:
  enabled: true

# ---
# Monitoring (Prometheus Operator)
# ---
# All three render the SAME files the Compose stack mounts: the chart's
# `files/alerts` and `files/dashboards` are symlinks into deploy/monitoring and
# deploy/compose/grafana, so a rule or panel is written once and both packaging
# paths get it.
#
# These objects need the Prometheus Operator CRDs (PrometheusRule,
# ServiceMonitor) already installed in the cluster. Enabling them without the
# operator fails the apply with `no matches for kind "ServiceMonitor" in version
# "monitoring.coreos.com/v1"`, which is the whole diagnosis.
monitoring:
  serviceMonitor:
    enabled: false
    # Extra labels. Most Prometheus Operator installs select ServiceMonitors by
    # a label (`release: kube-prometheus-stack` is the common one) and ignore
    # everything else, silently.
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s
    # Per-scrape ceilings, written at the ServiceMonitor spec level so they
    # cover both endpoints. A tripped limit fails the WHOLE scrape: the target
    # goes down, `up` reads 0, and every alert below reads as "no data" rather
    # than naming the limit. So they are sized well above what the registry
    # can reach, not close to it: the HTTP histogram alone is 14 series per
    # (method, route, status code) and a long-running API with every route
    # exercised sits in the low tens of thousands. Raise sampleLimit before
    # adding a high-cardinality label. 0 on any of them means no limit.
    # The three label limits need Prometheus 2.27 or later; sampleLimit is older.
    sampleLimit: 50000
    labelLimit: 30
    labelNameLengthLimit: 200
    labelValueLengthLimit: 200
    # Who the API NetworkPolicy admits on port 3000 for the scrape. The policy's
    # default ingressFrom names ingress controllers, which Prometheus is not, so
    # without this the `health` endpoint scrapes (the worker policy admits any
    # pod on that port) and the `http` one is dropped at the network layer with
    # a correct bearer token: half a ServiceMonitor, and nothing says why.
    # Same entry shape as networkPolicy.ingressFrom, namespaceSelector required
    # for the same reason. The default names the namespace kube-prometheus-stack
    # is most often installed into; point it at yours. Set to [] if your
    # cluster has its own policy for the monitoring namespace.
    scrapeFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Base URL of the runbook every shipped alert links to in its
    # `runbook_url` annotation. The chart rewrites the shipped base to this
    # value, so one setting repoints every link at an internal wiki. The
    # anchors do not change: each alert appends `#<lowercase alert name>`, so
    # whatever you point at needs a heading per alert under those same anchors.
    runbookUrl: https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md
    # Per-alert changes without forking the rules file, keyed by alert name
    # exactly as it appears in the chart's files/alerts/agledger.rules.yml.
    # An override naming an alert that does not exist FAILS the render: a typo
    # that silently changed nothing is the failure mode this exists to avoid.
    #
    #   overrides:
    #     AGLedgerWorkerJobsFailing:
    #       severity: critical    # replaces labels.severity
    #       for: 30m              # replaces the pending duration
    #       keepFiringFor: 5m     # renders as the CRD's keep_firing_for
    #       expr: |               # full replacement, not a patch
    #         sum(rate(agledger_worker_jobs_processed_total{status="failure"}[10m]))
    #         / clamp_min(sum(rate(agledger_worker_jobs_processed_total[10m])), 0.001) > 0.25
    #     AGLedgerPartitionRunwayLow:
    #       disabled: true        # drops the rule. A group left with no rules
    #                             # is dropped with it.
    overrides: {}
    # Customer-authored groups, appended verbatim after the shipped ones.
    # Same shape as the `groups:` entries of a Prometheus rule file. Nothing
    # here is checked against the metric registry the way the shipped rules
    # are, so an expression naming a metric this build does not emit renders
    # and then never fires. `promtool check rules` on the rendered spec is the
    # check this chart cannot do for you.
    additionalGroups: []
    #  - name: my-org-agledger
    #    rules:
    #      - alert: MyOrgNoRecordsWritten
    #        expr: increase(agledger_records_created_total[30m]) == 0
    #        for: 1h
    #        labels:
    #          severity: warning
    #        annotations:
    #          summary: "No records written in the last 30m"
  grafanaDashboards:
    enabled: false
    # The label the Grafana sidecar watches. Matches the grafana chart default.
    label: grafana_dashboard
    labelValue: "1"
    # Optional folder for the sidecar to file them under.
    folderAnnotation: ""
    folderAnnotationKey: grafana_folder

# ---
# Network Policy
# ---
networkPolicy:
  enabled: true
  # Who may reach the API on port 3000. Each entry is a namespaceSelector AND a
  # podSelector, and the namespaceSelector is required: a pod label alone is not
  # an identity, since any workload can label its pod `ingress-nginx`, so a
  # label matched in every namespace admits whoever claims it. The defaults name
  # the namespaces each controller's own install uses (k3s runs Traefik in
  # kube-system). Point them at yours if it differs, or the controller's
  # traffic is dropped and the API answers nothing through the ingress.
  # `namespaceSelector: {}` admits every namespace, when that is what you mean.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: [traefik, kube-system]
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
  # Source CIDRs allowed to reach the API on port 3000, in addition to the
  # ingressFrom podSelectors above. Required for load balancers that connect
  # from outside the pod network — e.g. AWS ALB with target-type: ip health-
  # checks and forwards traffic from VPC ENIs, which no podSelector can match.
  # Set this to your VPC or subnet CIDR(s) instead of disabling the policy.
  ingressCIDRs: []
  #  - 10.0.0.0/16
  # Egress rules appended to the api and worker policies, in NetworkPolicy
  # `egress` shape. The shipped rules admit DNS, the database, the OTLP
  # collector, and 443 to public addresses only, so anything else the Server
  # connects to needs an entry here. The common one is an anchor store that is
  # not public S3 on 443: an in-cluster object store (MinIO on 9000, for an
  # air-gapped install), or a store on a private address (an S3 interface
  # endpoint, an on-premises appliance). Name the store's pods and namespace,
  # or its CIDR, and its port:
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: minio
  #        podSelector:
  #          matchLabels:
  #            app.kubernetes.io/name: minio
  #    ports:
  #      - port: 9000
  #        protocol: TCP
  #  - to:
  #      - ipBlock:
  #          cidr: 10.20.0.0/16
  #    ports:
  #      - port: 443
  #        protocol: TCP
  extraEgress: []

# ---
# Pod Disruption Budget
# ---
pdb:
  enabled: true
  minAvailable: 1

# ---
# Service Account
# ---
serviceAccount:
  create: true
  name: ""
  annotations: {}           # e.g. eks.amazonaws.com/role-arn for IRSA (KMS custody, anchoring)
  # Mount the account's Kubernetes API token into the api, worker, migration,
  # preflight and backup pods. Off: the Server never calls the Kubernetes API,
  # and IRSA and EKS Pod Identity inject their own token. Turn it on only for a
  # sidecar that authenticates with it (a Vault Agent on Kubernetes auth).
  automountToken: false

# ---
# Provisioning (YAML config-as-code)
# ---
# Mounts YAML files at startup for declarative resource management.
provisioning:
  enabled: false
  configPath: /etc/agledger/provisioning  # Mount path inside container
  dryRun: false
  # Offboards resources removed from the YAML, rather than leaving them
  # orphaned. For an org or agent that means revoking its API keys, releasing
  # management and deactivating the account, so it refuses every credential
  # bound to it and cannot be issued a new one. Undo with
  # POST /v1/admin/{orgs|agents}/{id}/reactivate, which is platform-only.
  # A prune is skipped entirely for any reload whose config did not load
  # cleanly, so a typo never reads as a removal.
  prune: false
  immutable: false  # Set true to create immutable ConfigMap (reduces apiserver load;
                     # requires delete + recreate on changes, not in-place edit)

  # Reference existing ConfigMaps (one per subdirectory).
  # Mutually exclusive with inline content below.
  # Each ConfigMap is mounted directly as the corresponding subdirectory.
  existingConfigMaps:
    orgs: ""  # ConfigMap name for orgs/*.yaml
    agents: ""       # ConfigMap name for agents/*.yaml
    webhooks: ""     # ConfigMap name for webhooks/*.yaml
    schemas: ""      # ConfigMap name for schemas/*.yaml
    # ConfigMap carrying trusted-issuers.yaml. Mounted as a directory at
    # <configPath>/trusted-issuers/, like the four above, but projecting a
    # single key: the ConfigMap must have one named exactly
    # `trusted-issuers.yaml`, and any other key is not projected. The loader
    # takes the file at <configPath>/trusted-issuers/trusted-issuers.yaml or at
    # <configPath>/trusted-issuers.yaml, and the chart uses the first; the
    # second is the plain on-disk layout Compose and bare-metal installs use.
    # A single-file subPath mount is deliberately not used, because kubelet
    # never refreshes one, so an edited ConfigMap could not reach a running pod
    # and the reload would report a clean no-op over the original bytes.
    trustedIssuers: ""

  # Inline YAML content — a ConfigMap is created automatically.
  # Each key becomes a file in the corresponding subdirectory.
  #
  # The commented examples below are read back out of this file and validated
  # against the provisioning loader on every build, so what you uncomment is
  # what the reconciler accepts. Keep the `  #  ` comment prefix and the
  # two-space file-key indent if you edit them, or that check stops seeing
  # them. `examples/provisioning/` carries the fuller versions, including API
  # keys and field mappings.
  orgs: {}
  #  my-corp.yaml: |
  #    orgs:
  #      - name: My Corp

  # A standalone agent names its owning org. That org must be declared under
  # `orgs` above, or already exist from an earlier reconcile.
  agents: {}
  #  my-agent.yaml: |
  #    agents:
  #      - displayName: My Agent
  #        orgName: My Corp
  #        agentClass: system

  # `ownerName` is an org name (ownerType: org) or an agent displayName
  # (ownerType: agent, plus `ownerOrgName` to say which org's agent).
  webhooks: {}
  #  notifications.yaml: |
  #    webhooks:
  #      - ownerName: My Corp
  #        ownerType: org
  #        url: https://hooks.example.com/agledger
  #        eventTypes:
  #          - record.created

  # Which external IdPs this Server accepts JWTs from. A list, not a map of
  # files: the loader reads one fixed file name, `trusted-issuers.yaml`, which
  # the chart projects at <configPath>/trusted-issuers/ and renders these
  # entries into under its `trusted_issuers:` key. Same validators as POST /v1/admin/trusted-issuers,
  # so what the admin API refuses this refuses too.
  #
  # Rows created here carry managed_by = 'provisioning' and are reconciled on
  # every pass: dropping an entry deletes its row, and editing its
  # expectedAudience or appliesTo, or adding an orgId to a global entry,
  # updates the row in place. Rows an operator created through the admin API
  # are left alone and reported as skipped.
  #
  # jwksUri is optional; without it the loader runs OIDC discovery against the
  # issuer on every pass, so a moved jwks_uri is picked up on reload. An IdP
  # this Server cannot reach refuses a new entry for that pass; an entry that
  # already has a row keeps its stored jwks_uri with a warning, and every other
  # field it declares still applies. The rest of the file still applies.
  #
  # autoProvisionAgents (default false) lets one row create the agents it has
  # never seen: the first token from an unknown subject makes an ephemeral agent
  # under the row's org instead of the exchange being refused. It is for fleets
  # of short-lived workloads (CI jobs, per-task pods) where declaring each one is
  # the problem. A stable fleet does not need it: declare the agents under
  # `agents` above with oidcIss/oidcSub and leave this off.
  #
  # Turning it on means an IdP token can create rows here, so it comes with
  # three requirements the loader refuses to start without:
  #   - orgId must name a real org. A global (orgId: null) row has no tenant.
  #   - autoProvisionScopeProfile is required, and is the scope CEILING for every
  #     cert this row mints: the IdP's mapped scopes claim can narrow it and can
  #     never widen it, and a claim sharing nothing with it is refused rather
  #     than minted scopeless. Agent-role profiles only (agent-full,
  #     agent-readonly, agent-performer-only). The ceiling keys on this field
  #     alone, so it holds whether or not the row also creates agents: set it
  #     with autoProvisionAgents left false to cap an IdP whose agents you bind
  #     by hand, and clearing the flag later does not lift it off the agents the
  #     row already made.
  #   - autoProvisionMaxAgents caps how many agents the row may create in that
  #     org (default 1000, max 100000). At the cap the exchange is refused.
  # Each creation writes an AGENT_AUTO_PROVISIONED chain entry and an
  # auth.agent_auto_provisioned row on the SIEM stream.
  #
  # subjectAllowlist (default null) names the exact `sub` values a row admits,
  # compared character for character. A verified token whose subject is not
  # listed is refused with 401 and reason `subject_not_allowlisted`. Which
  # subject is compared depends on the door the row serves: the admin bearer's
  # own sub, the exchanging workload's sub at POST /v1/auth/oidc/cert, and the
  # delegation token's sub (the principal acted for, never act.sub) on the
  # AGLedger-On-Behalf-Of header. An `appliesTo: any` row serves all three and
  # one list gates all three, so split the row per appliesTo before adding a
  # list only one door should carry. With autoProvisionAgents on, this is what
  # stops an IdP-side assignment mistake from creating an agent here. Narrowing
  # the list stops the next cert exchange and does NOT revoke certs already
  # minted, which run to their own expiresAt; POST
  # /v1/admin/trusted-issuers/{id}/revoke-certs ends the live ones.
  #
  # jtiSingleUse (default false) accepts each admin bearer's token id once,
  # across every replica, and refuses a second presentation with 401 and reason
  # `jti_replayed`. Set it when the client mints a token per request, such as a
  # per-call client_credentials grant against Okta or Keycloak; leave it off
  # for a polling dashboard holding one token for a session, for a grant
  # metered per month, and for a projected Kubernetes service-account token,
  # which the kubelet rewrites only at 80 percent of its TTL (about 48 minutes
  # on the 1h default), so a pod re-presents one token for that whole window.
  #
  # The id is the jti claim, or the claim named under the claimMapping logical
  # name `jti`; the standard jti wins when the token carries both. Okta and
  # Keycloak mint jti by default. Entra ID mints none on an access or an ID
  # token and cannot be configured to; it mints uti, so an Entra row writes
  # claimMapping: { jti: uti }. Auth0's default access-token profile mints
  # neither: switch that API to the RFC 9068 profile, or leave the flag off. A
  # Google service-account ID token has no per-token id at all and cannot be
  # made single use.
  #
  # The flag governs the admin bearer alone, but the id it reads is shared.
  # POST /v1/auth/oidc/cert is single use per token id whatever the flag says
  # and resolves the id the same way, so a jti entry in claimMapping makes that
  # door single use per the mapped claim too. A token resolving no id is
  # exchangeable repeatedly there; an empty resolved id is refused with 400.
  #
  # A token with no id is admitted on every request even with the flag set,
  # which is the flag enforcing nothing: each such admission increments
  # agledger_oidc_admin_jti_unenforceable_total and the engine logs one WARN
  # per row per process naming the fix. An id that is empty or over 512
  # characters is refused with reason `jti_unregistrable`. The on-behalf-of
  # header is never deduplicated on any id.
  trustedIssuers: []
  #  - issuerUrl: https://login.example.com/
  #    expectedAudience: agledger
  #    appliesTo: any
  #    orgId: null
  #    label: Corporate IdP
  #  - issuerUrl: https://login.example.com/
  #    expectedAudience: agledger
  #    appliesTo: admin
  #    orgId: null
  #    label: Corporate IdP (operator SSO)
  #    claimMapping:
  #      role: agledger_role
  #      scopes: agledger_scopes
  #    jtiSingleUse: true
  #    subjectAllowlist:
  #      - svc-agledger-admin@corp.example.com
  #  - issuerUrl: https://kubernetes.default.svc/
  #    expectedAudience: agledger
  #    appliesTo: agent
  #    orgId: 00000000-0000-0000-0000-000000000000
  #    label: Cluster service accounts
  #    autoProvisionAgents: true
  #    autoProvisionScopeProfile: agent-performer-only
  #    autoProvisionMaxAgents: 500
  #    subjectAllowlist:
  #      - system:serviceaccount:agledger:worker

  # A type with a structured completionSchema runs the completion phase.
  # Omitting the key, or writing `{}`, makes it notarize-only, terminal at
  # RECORDED on create, which is what POST /v1/schemas does with it too.
  schemas: {}
  #  custom-type.yaml: |
  #    schemas:
  #      - type: CUSTOM-TYPE-v1
  #        displayName: Custom Type
  #        category: custom
  #        recordSchema:
  #          type: object
  #          required: [reference]
  #          properties:
  #            reference: { type: string }
  #        completionSchema: {}
