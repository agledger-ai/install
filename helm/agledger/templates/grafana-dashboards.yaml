{{- include "agledger.validateValues" . -}}
{{- if ((.Values.monitoring).grafanaDashboards).enabled }}
{{- /* The same three dashboards the Compose stack provisions:
       templates/../files/dashboards is a symlink to the compose Grafana
       provisioning directory, so a panel added there ships on Kubernetes too.
       One ConfigMap per dashboard, because the sidecar reads a whole ConfigMap
       as one dashboard's worth of files and a 60 KB JSON leaves little room
       under the 1 MB object cap. */}}
{{- $root := . }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- /* Truncate the release half, never $name: `trunc 63` over the whole
         string cuts the tail, and the tail is the only part that differs. A
         release name past ~37 characters gave all three dashboards the same
         ConfigMap name, and two of the three silently vanished. */}}
  name: {{ printf "%s-dash-%s" (include "agledger.fullname" $root | trunc (sub 57 (len $name) | int) | trimSuffix "-") $name | trunc 63 }}
  labels:
    {{- include "agledger.labels" $root | nindent 4 }}
    app.kubernetes.io/component: dashboard
    {{- /* The label the Grafana sidecar watches for. Default matches the
           grafana chart's own `sidecar.dashboards.label`. */}}
    {{ ((($root.Values.monitoring).grafanaDashboards).label | default "grafana_dashboard") }}: {{ ((($root.Values.monitoring).grafanaDashboards).labelValue | default "1") | quote }}
  {{- with ((($root.Values.monitoring).grafanaDashboards).folderAnnotation) }}
  annotations:
    {{ $.Values.monitoring.grafanaDashboards.folderAnnotationKey | default "grafana_folder" }}: {{ . | quote }}
  {{- end }}
data:
  {{ base $path }}: |
    {{- $root.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
