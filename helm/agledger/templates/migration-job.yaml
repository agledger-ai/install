{{- define "agledger.migrateJobSpec" }}
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "agledger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "agledger.serviceAccountName" . }}
      automountServiceAccountToken: {{ include "agledger.automountToken" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not (.Values.openshift).enabled }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      restartPolicy: Never
      {{- if (include "agledger.bundledPostgres" .) }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.bundled.image }}
          command: ['sh', '-c', 'until pg_isready -h {{ include "agledger.fullname" . }}-postgres -p 5432 -U agledger; do echo "Waiting for postgres..."; sleep 2; done']
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "agledger.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Node 24 Permission Model hardening, the same prefix the api and
          # worker containers carry (see values.yaml `permission`). Not only
          # the sandbox: NODE_OPTIONS reaches every node process in a
          # container, Node refuses `--allow-fs-write` from a process not
          # started with `--permission` and an `--import` from one holding no
          # `--allow-fs-read`, and migrate.extraEnv/extraEnvFrom
          # reach this container. Without the prefix such a value fails the
          # Job at pre-execution with ERR_MISSING_OPTION and no migration
          # runs. migrate.js only reads the filesystem.
          command: ["/nodejs/bin/node", {{ include "agledger.permissionArgs" . }}"dist/src/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "agledger.fullname" . }}
            - secretRef:
                name: {{ include "agledger.secretName" . }}
            {{- with .Values.migrate.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.secrets.databaseUrlMigrate }}
          {{- include "agledger.assertNoDuplicateDatabaseUrl" (dict "envList" .Values.migrate.extraEnv "field" "migrate.extraEnv" "source" "secrets.databaseUrlMigrate") }}
          {{- else if (include "agledger.chartSuppliesDatabaseUrl" .) }}
          {{- include "agledger.assertNoDuplicateDatabaseUrl" (dict "envList" .Values.migrate.extraEnv "field" "migrate.extraEnv" "source" "the chart's Secret") }}
          {{- end }}
          {{- if or .Values.secrets.databaseUrlMigrate .Values.migrate.extraEnv }}
          env:
          {{- if .Values.secrets.databaseUrlMigrate }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agledger.secretName" . }}
                  key: DATABASE_URL_MIGRATE
            {{- /* The migrate CLI prefers DATABASE_URL_DIRECT over DATABASE_URL,
                   which is right when the pool is pooled and no owner role is
                   named. Here an owner role IS named and arrives as
                   DATABASE_URL, so the direct URL is cleared on this Job to
                   keep the DDL on the role that can do it. The owner URL must
                   itself reach the database directly. */}}
            - name: DATABASE_URL_DIRECT
              value: ""
          {{- end }}
          {{- with .Values.migrate.extraEnv }}
          {{- include "agledger.envList" . | trim | nindent 12 }}
          {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          resources:
            {{- toYaml (.Values.migrate.resources | default .Values.api.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "agledger.licenseVolumeMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "agledger.licenseVolume" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (.Values.migrate.nodeSelector | default .Values.api.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.migrate.tolerations | default .Values.api.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.migrate.affinity | default .Values.api.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- $spec := include "agledger.migrateJobSpec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  # Bundled Postgres is a normal chart resource, not a hook — Helm only creates it
  # AFTER all pre-install hooks succeed. If the migration ran as a pre-install hook
  # here, its wait-for-db init container would block forever waiting for a Postgres
  # that does not yet exist → `helm install` deadlocks. So on the
  # bundled path the migration is a normal resource too, applied alongside Postgres,
  # ordered by the wait-for-db init container below. The name is per-revision so
  # `helm upgrade` creates a fresh Job (a fixed-name normal Job is rejected on
  # upgrade — Job pod templates are immutable); ttlSecondsAfterFinished GCs old ones.
  # External DB always pre-exists, so that path keeps the pre-install/pre-upgrade hook.
  {{- /* On bundled Postgres the name carries the revision AND a hash of the
         rendered spec below. The revision makes each `helm upgrade` a fresh
         Job. A renderer (helm template, Argo CD, Flux) renders every sync as
         revision 1, so there the hash is what moves: a new image, or any
         other change to what the Job runs, is a new Job name, and the
         previous name, whose spec is immutable, is pruned rather than
         patched. An unchanged spec keeps its name, which is right too: the
         same image has no migration the last run did not apply. */}}
  {{- /* The cut to 36 characters is only where the revision and hash follow it.
         The hook name on the external path has neither, so it keeps the whole
         fullname: two releases sharing a cut prefix would share a hook name,
         and before-hook-creation would delete the other release's Job. */}}
  {{- if (include "agledger.bundledPostgres" .) }}
  name: {{ include "agledger.fullname" . | trunc 36 | trimSuffix "-" }}-migrate-{{ .Release.Revision }}-{{ $spec | sha256sum | trunc 8 }}
  {{- else }}
  name: {{ include "agledger.fullname" . }}-migrate
  {{- end }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if not (include "agledger.bundledPostgres" .) }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
{{- $spec }}
