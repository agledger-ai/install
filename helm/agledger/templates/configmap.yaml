{{- include "agledger.validateValues" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agledger.fullname" . }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AGLEDGER_EXTERNAL_URL: {{ include "agledger.externalUrl" . | quote }}
  # Post-v1.0 the migration baseline is frozen — the migrate job refuses to
  # rebase an applied migration's checksum. Shipped migrations are immutable;
  # every schema delta is a new numbered migration.
  AGLEDGER_LAUNCH_FROZEN: "true"
  TRUST_PROXY: {{ .Values.config.trustProxy | quote }}
  OTEL_PROVIDER: {{ .Values.config.otelProvider | quote }}
  {{- /* Absent by default, and absent is the off switch: the Server starts its
         OTel SDK only when this variable is set, so an empty value has to be
         left out rather than written as "". It must be the BASE url of the
         collector's HTTP receiver (`:4318`), with no `/v1/...` suffix, because
         the exporters append the per-signal path themselves and this build
         speaks OTLP over HTTP rather than gRPC. A `:4317` value or one
         carrying a signal path boots and WARNs, and nothing arrives. */}}
  {{- if .Values.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  {{- end }}
  AGLEDGER_EXAMPLE_CONTRACT_TYPE: {{ .Values.config.exampleType | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  {{- /* RATE_LIMIT_STORE defaults to `memory`, which counts per replica: two
         API pods with a 100/min limit admit 200/min, and an HPA makes the real
         ceiling a function of load. The chart knows the replica shape, so it
         answers for it. `postgresql` shares the counter through the database
         the install already depends on. An explicit config.rateLimitStore wins,
         including the operator who wants per-replica counting on purpose. */}}
  {{- $rateLimitStore := .Values.config.rateLimitStore }}
  {{- if not $rateLimitStore }}
  {{- $rateLimitStore = "memory" }}
  {{- if or (gt (int .Values.api.replicaCount) 1) ((.Values.hpa).enabled) }}
  {{- $rateLimitStore = "postgresql" }}
  {{- end }}
  {{- end }}
  RATE_LIMIT_STORE: {{ $rateLimitStore | quote }}
  CORS_ENABLED: {{ .Values.config.corsEnabled | quote }}
  HELMET_ENABLED: {{ .Values.config.helmetEnabled | quote }}
  {{- if .Values.config.allowNonDefaultSigningAlg }}
  AGLEDGER_ALLOW_NON_DEFAULT_SIGNING_ALG: "true"
  {{- end }}
  DATABASE_POOL_MAX: {{ .Values.database.poolMax | quote }}
  DATABASE_IDLE_IN_TX_TIMEOUT_MS: {{ include "agledger.idleInTxTimeoutMs" . | quote }}
  DATABASE_STATEMENT_TIMEOUT_MS: {{ include "agledger.statementTimeoutMs" . | quote }}
  WORKER_HEALTH_PORT: {{ .Values.worker.healthPort | quote }}
  {{- if .Values.config.nodeExtraCaCerts }}
  NODE_EXTRA_CA_CERTS: {{ .Values.config.nodeExtraCaCerts | quote }}
  {{- end }}
  {{- if (.Values.license).releaseDate }}
  AGLEDGER_RELEASE_DATE: {{ (.Values.license).releaseDate | quote }}
  {{- end }}
  {{- if ((.Values.license).keyFile).enabled }}
  AGLEDGER_LICENSE_KEY_FILE: {{ printf "%s/%s" ((.Values.license).keyFile).mountPath ((.Values.license).keyFile).secretKey | quote }}
  {{- end }}
  {{- if (include "agledger.bundledPostgres" .) }}
  ALLOW_DB_WITHOUT_SSL: "true"
  AGLEDGER_PG_BUNDLED: "true"
  {{- end }}
  {{- if (.Values.provisioning).enabled }}
  PROVISIONING_CONFIG_PATH: {{ .Values.provisioning.configPath | quote }}
  {{- if .Values.provisioning.dryRun }}
  PROVISIONING_DRY_RUN: "true"
  {{- end }}
  {{- if .Values.provisioning.prune }}
  PROVISIONING_PRUNE: "true"
  {{- end }}
  {{- end }}
  {{- if (.Values.marketplace).productId }}
  AWS_MARKETPLACE_PRODUCT_ID: {{ (.Values.marketplace).productId | quote }}
  {{- end }}
  {{- if (.Values.signing).kmsKeyArn }}
  VAULT_SIGNING_KEY_KMS_ARN: {{ .Values.signing.kmsKeyArn | quote }}
  {{- if .Values.signing.kmsEndpoint }}
  VAULT_SIGNING_KEY_KMS_ENDPOINT: {{ .Values.signing.kmsEndpoint | quote }}
  {{- end }}
  {{- if .Values.signing.remoteMaxPerSecond }}
  VAULT_SIGNING_REMOTE_MAX_PER_SECOND: {{ .Values.signing.remoteMaxPerSecond | quote }}
  {{- end }}
  {{- end }}
  {{- if (.Values.marketplace).publicKeyVersion }}
  AWS_MARKETPLACE_PUBLIC_KEY_VERSION: {{ (.Values.marketplace).publicKeyVersion | quote }}
  {{- end }}
