{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.database.externalUrl) (not ((.Values.postgres).bundled).enabled) }}
  {{- fail "database.externalUrl is required when postgres.bundled.enabled is false: provide a PostgreSQL connection string" }}
{{- end }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "agledger.fullname" .) | default dict }}
{{- $existingData := $existingSecret.data | default dict }}
{{/* The three values below are GENERATED when neither the operator nor the
     existing release supplies one, and preserved across upgrades by reading the
     release Secret back with `lookup`.

     `lookup` asks the API server, so it answers only during a real helm
     install or upgrade. Under a renderer (Argo CD, or any
     `helm template | kubectl apply` pipeline) it returns an empty dict, every
     sync falls through to the generator, and the Secret is applied carrying
     values nothing has seen before: every API key issued against the previous
     API_KEY_SECRET stops authenticating, the bundled-PostgreSQL password stops
     matching what initdb set, and the Prometheus the last sync configured
     starts collecting 401s. From here that is indistinguishable from a first
     install, so nothing warns.

     There is no in-template flag that separates the two: `.Release.IsInstall`
     is true under `helm template` as well. `secrets.gitops` is the operator
     saying which one this is, and it turns each fallback below into a render
     failure naming what to supply instead. The supported answer is
     `secrets.existingSecret`, which skips this whole template.

     $vaultSigningKey has never had a generator, which is why it alone was
     already safe under a renderer. */}}
{{- $gitops := (.Values.secrets).gitops | default false }}
{{- $apiKeySecret := .Values.secrets.apiKeySecret | default ($existingData.API_KEY_SECRET | default "" | b64dec) }}
{{- if not $apiKeySecret }}
  {{- if $gitops }}
    {{- fail "secrets.gitops is true and secrets.apiKeySecret is unset. API_KEY_SECRET is the HMAC key every API key is hashed under, and a renderer cannot read the value the last sync applied, so generating one here would silently stop every issued key from authenticating. Set secrets.existingSecret to a Secret your platform manages (External Secrets, Sealed Secrets, SOPS) and the chart writes no Secret at all, or pin secrets.apiKeySecret to a value your renderer holds." }}
  {{- end }}
  {{- $apiKeySecret = randAlphaNum 64 }}
{{- end }}
{{/* Bundled-PG password: reuse existing, then user-provided, then generate (never a static default) */}}
{{- $pgPassword := ((.Values.postgres).bundled).password | default ($existingData.POSTGRES_PASSWORD | default "" | b64dec) }}
{{- if not $pgPassword }}
  {{/* Exactly the condition the `stringData` block below emits
       POSTGRES_PASSWORD under, and it has to stay exactly that: a render that
       writes no such key must not be refused over one, and a render that
       writes one must not slip past the guard. Both read the same helper, so
       they cannot drift apart. */}}
  {{- if and $gitops (include "agledger.bundledPostgres" .) }}
    {{- fail "secrets.gitops is true and postgres.bundled.password is unset. initdb sets the bundled PostgreSQL password once, from the first Secret it sees, and a renderer cannot read that value back, so generating one here would leave DATABASE_URL carrying a password the database does not have. Set secrets.existingSecret and supply DATABASE_URL yourself, pin postgres.bundled.password, or run an external database." }}
  {{- end }}
  {{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{/* /metrics bearer token. Preserved across upgrades the way apiKeySecret is:
     regenerating it would 401 the Prometheus the last install configured, and
     the scrape failing is invisible until someone looks at a dashboard.
     `secrets.metricsAuthToken: "-"` is the documented way to say "no token" for
     an install that gates /metrics behind the API-key chain instead. */}}
{{- $metricsToken := .Values.secrets.metricsAuthToken | default ($existingData.METRICS_AUTH_TOKEN | default "" | b64dec) }}
{{- if not $metricsToken }}
  {{- if $gitops }}
    {{- fail "secrets.gitops is true and secrets.metricsAuthToken is unset. A renderer cannot read the token the last sync applied, so generating one here would 401 the Prometheus already scraping this install, which is invisible until someone looks at a dashboard. Pin secrets.metricsAuthToken, set it to \"-\" to mint none and leave /metrics behind the API-key chain, or set secrets.existingSecret and carry METRICS_AUTH_TOKEN in it." }}
  {{- end }}
  {{- $metricsToken = randAlphaNum 48 }}
{{- end }}
{{/* Vault signing key: reuse existing → user-provided → fail with helpful message */}}
{{- $vaultSigningKey := .Values.secrets.vaultSigningKey | default ($existingData.VAULT_SIGNING_KEY | default "" | b64dec) }}
{{- if not $vaultSigningKey }}
  {{/* The offline command comes FIRST. The quick-start URL is a
       network fetch, and an operator hitting this failure needs a recovery step
       that works from the cluster they already have.

       `--command` is load-bearing. The image sets
       ENTRYPOINT ["/nodejs/bin/node"], and without `--command` kubectl passes
       everything after `--` as the pod's args, which APPEND to the entrypoint.
       The container then runs `node /nodejs/bin/node dist/scripts/...`, parses
       its own ELF binary, and dies with a SyntaxError instead of printing a key.
       `--command` makes those tokens the container's command, replacing it.
       Keep this in sync with helm-install.sh, which already passes it.

       The image comes from the `agledger.image` helper rather than a bare
       `agledger/agledger`, so the keygen pod is the same build the chart is
       about to deploy (tag, or digest when pinned). An untagged reference
       resolves to :latest, and the generator is not version-neutral: only
       builds that carry --algorithm can emit an ES256 key, so a FIPS operator
       on a pinned older chart would otherwise get a silent Ed25519 key. */}}
  {{- fail (printf "secrets.vaultSigningKey is required on first install. Generate a key:\n  kubectl run keygen --rm -it --restart=Never --image=%s --command -- /nodejs/bin/node dist/scripts/generate-signing-key.js\nWrite the VAULT_SIGNING_KEY value it prints to a file and re-run with:\n  umask 077 && printf '%%s' '<key>' > vault-signing-key\n  --set-file secrets.vaultSigningKey=./vault-signing-key\n(--set-file, not --set: an argument is readable by every local user through ps for the length of the install, and this key signs every record on the chain.)\nOr use the guided quick-start, which generates the key and installs in one step:\n  curl -fsSL https://agledger.ai/helm-install.sh | bash" (include "agledger.image" .)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agledger.fullname" . }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  API_KEY_SECRET: {{ $apiKeySecret | quote }}
  VAULT_SIGNING_KEY: {{ $vaultSigningKey | quote }}
  {{- if ne $metricsToken "-" }}
  METRICS_AUTH_TOKEN: {{ $metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookEncryptionKey }}
  WEBHOOK_ENCRYPTION_KEY: {{ .Values.secrets.webhookEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.database.externalUrl }}
  DATABASE_URL: {{ .Values.database.externalUrl | quote }}
  {{- else if (include "agledger.bundledPostgres" .) }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  # checkov:skip=CKV_SECRET_4: helm template placeholder, not a literal credential
  DATABASE_URL: {{ printf "postgresql://agledger:%s@%s-postgres:5432/agledger" $pgPassword (include "agledger.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrlMigrate }}
  DATABASE_URL_MIGRATE: {{ .Values.secrets.databaseUrlMigrate | quote }}
  {{- end }}
  {{- if .Values.secrets.license }}
  AGLEDGER_LICENSE: {{ .Values.secrets.license | quote }}
  {{- end }}
  {{- if .Values.secrets.licenseKey }}
  AGLEDGER_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKeySecretPrevious }}
  API_KEY_SECRET_PREVIOUS: {{ .Values.secrets.apiKeySecretPrevious | quote }}
  {{- end }}
{{- end }}
