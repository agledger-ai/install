{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.database.externalUrl) (not ((.Values.postgres).bundled).enabled) }}
  {{- fail "database.externalUrl is required when postgres.bundled.enabled is false: provide a PostgreSQL connection string" }}
{{- end }}
{{- include "agledger.resolveSecretValues" . }}
{{- $resolved := get .Values "_resolvedSecretValues" }}
{{- $apiKeySecret := $resolved.apiKeySecret }}
{{- $pgPassword := $resolved.pgPassword }}
{{- $metricsToken := $resolved.metricsToken }}
{{/* Vault signing key: user-provided → reuse existing → fail with helpful message.
     Under KMS custody (signing.kmsKeyArn) the process holds no key material, so
     none is required and none is written: VAULT_SIGNING_KEY beside the ARN
     refuses to boot. A key this install signed with before belongs in
     secrets.vaultSigningKeyPrevious. */}}
{{- $kmsCustody := (.Values.signing).kmsKeyArn }}
{{- $vaultSigningKey := $resolved.vaultSigningKey }}
{{- if and (.Values.signing).previousKmsKeyArn .Values.secrets.vaultSigningKeyPrevious }}
  {{- fail "signing.previousKmsKeyArn and secrets.vaultSigningKeyPrevious are both set. A process succeeds one key: keep the one that names the key the running pods sign with." }}
{{- end }}
{{- if and $kmsCustody .Values.secrets.vaultSigningKey }}
  {{- fail "signing.kmsKeyArn and secrets.vaultSigningKey are both set. A process signs with one key: unset secrets.vaultSigningKey to sign with the KMS key (move a key this install has signed with to secrets.vaultSigningKeyPrevious so its history stays verifiable), or unset signing.kmsKeyArn." }}
{{- end }}
{{- if and (not $vaultSigningKey) (not $kmsCustody) }}
  {{/* The offline command comes FIRST. The quick-start URL is a
       network fetch, and an operator hitting this failure needs a recovery step
       that works from the cluster they already have.

       `--command` is load-bearing. The image sets
       ENTRYPOINT ["/nodejs/bin/node"], and without `--command` kubectl passes
       everything after `--` as the pod's args, which APPEND to the entrypoint.
       The container then runs `node /nodejs/bin/node dist/scripts/...`, parses
       its own ELF binary, and dies with a SyntaxError instead of printing a key.
       `--command` makes those tokens the container's command, replacing it.
       Keep this in sync with helm-install.sh, which already passes it.

       The image comes from the `agledger.image` helper rather than a bare
       `agledger/agledger`, so the keygen pod is the same build the chart is
       about to deploy (tag, or digest when pinned). An untagged reference
       resolves to :latest, which need not be the build this chart deploys. */}}
  {{- fail (printf "secrets.vaultSigningKey is required on first install. Generate a key:\n  kubectl run keygen --rm -it --restart=Never --image=%s --command -- /nodejs/bin/node dist/scripts/generate-signing-key.js\nWrite the VAULT_SIGNING_KEY value it prints to a file and re-run with:\n  umask 077 && printf '%%s' '<key>' > vault-signing-key\n  --set-file secrets.vaultSigningKey=./vault-signing-key\n(--set-file, not --set: an argument is readable by every local user through ps for the length of the install, and this key signs every record on the chain.)\nOr use the guided quick-start, which generates the key and installs in one step:\n  curl -fsSL https://agledger.ai/helm-install.sh | bash" (include "agledger.image" .)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agledger.fullname" . }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  API_KEY_SECRET: {{ $apiKeySecret | quote }}
  {{- if not $kmsCustody }}
  VAULT_SIGNING_KEY: {{ $vaultSigningKey | quote }}
  {{- end }}
  {{- if ne $metricsToken "-" }}
  METRICS_AUTH_TOKEN: {{ $metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookEncryptionKey }}
  WEBHOOK_ENCRYPTION_KEY: {{ .Values.secrets.webhookEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookEncryptionKeyPrevious }}
  WEBHOOK_ENCRYPTION_KEY_PREVIOUS: {{ .Values.secrets.webhookEncryptionKeyPrevious | quote }}
  {{- end }}
  {{- if .Values.database.externalUrl }}
  DATABASE_URL: {{ .Values.database.externalUrl | quote }}
  {{- else if (include "agledger.bundledPostgres" .) }}
  {{- /* The bundled database has one owner role, `agledger`, and an owner
         passes every privilege check on its own tables, so serving as it
         leaves the audit chain's UPDATE/DELETE revokes binding nobody. The
         API and worker connect as agledger_app instead; the migration Job
         connects as the owner (DATABASE_URL_MIGRATE, which the migrate CLI
         prefers) and gives agledger_app its login under
         AGLEDGER_APP_ROLE_PASSWORD on every run.

         Derived from the owner password rather than generated, so it needs
         no `lookup` to survive an upgrade and no secrets.gitops refusal under
         a renderer: it is stable exactly when the owner password is. A hash,
         so the owner password cannot be read back out of it. */}}
  {{- $appPassword := printf "%s:agledger_app" $pgPassword | sha256sum | trunc 48 }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  AGLEDGER_APP_ROLE_PASSWORD: {{ $appPassword | quote }}
  # checkov:skip=CKV_SECRET_4: helm template placeholder, not a literal credential
  DATABASE_URL: {{ printf "postgresql://agledger_app:%s@%s-postgres:5432/agledger" $appPassword (include "agledger.fullname" .) | quote }}
  {{- if not .Values.secrets.databaseUrlMigrate }}
  # checkov:skip=CKV_SECRET_4: helm template placeholder, not a literal credential
  DATABASE_URL_MIGRATE: {{ printf "postgresql://agledger:%s@%s-postgres:5432/agledger" $pgPassword (include "agledger.fullname" .) | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.databaseUrlMigrate }}
  DATABASE_URL_MIGRATE: {{ .Values.secrets.databaseUrlMigrate | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrlDirect }}
  DATABASE_URL_DIRECT: {{ .Values.secrets.databaseUrlDirect | quote }}
  {{- end }}
  {{- if .Values.secrets.license }}
  AGLEDGER_LICENSE: {{ .Values.secrets.license | quote }}
  {{- end }}
  {{- if .Values.secrets.licenseKey }}
  AGLEDGER_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKeySecretPrevious }}
  API_KEY_SECRET_PREVIOUS: {{ .Values.secrets.apiKeySecretPrevious | quote }}
  {{- end }}
  {{/* During a key change, the key the running pods sign with. The first pod
       on the new key signs the succession admitting it with both keys, which
       is what lets every other pod and every auditor trust the new key. A
       value here means a key change needs no `secrets.existingSecret`. */}}
  {{- if .Values.secrets.vaultSigningKeyPrevious }}
  VAULT_SIGNING_KEY_PREVIOUS: {{ .Values.secrets.vaultSigningKeyPrevious | quote }}
  {{- end }}
{{- end }}
