{{- if not .Values.secrets.existingSecret }}
{{- if and (not .Values.database.externalUrl) (not .Values.postgres.bundled.enabled) }}
  {{- fail "database.externalUrl is required when postgres.bundled.enabled is false — provide a PostgreSQL connection string" }}
{{- end }}
{{/* Auto-generate apiKeySecret if not provided (64-char hex, same as install.sh) */}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "agledger.fullname" .) | default dict }}
{{- $existingData := $existingSecret.data | default dict }}
{{- $apiKeySecret := .Values.secrets.apiKeySecret | default ($existingData.API_KEY_SECRET | default "" | b64dec) | default (randAlphaNum 64) }}
{{/* Bundled-PG password: reuse existing → user-provided → generate (never a static default) */}}
{{- $pgPassword := .Values.postgres.bundled.password | default ($existingData.POSTGRES_PASSWORD | default "" | b64dec) | default (randAlphaNum 32) }}
{{/* Vault signing key: reuse existing → user-provided → fail with helpful message */}}
{{- $vaultSigningKey := .Values.secrets.vaultSigningKey | default ($existingData.VAULT_SIGNING_KEY | default "" | b64dec) }}
{{- if not $vaultSigningKey }}
  {{/* The offline command comes FIRST. The quick-start URL is a
       network fetch, and an operator hitting this failure needs a recovery step
       that works from the cluster they already have.

       `--command` is load-bearing. The image sets
       ENTRYPOINT ["/nodejs/bin/node"], and without `--command` kubectl passes
       everything after `--` as the pod's args, which APPEND to the entrypoint.
       The container then runs `node /nodejs/bin/node dist/scripts/...`, parses
       its own ELF binary, and dies with a SyntaxError instead of printing a key.
       `--command` makes those tokens the container's command, replacing it.
       Keep this in sync with helm-install.sh, which already passes it.

       The image comes from the `agledger.image` helper rather than a bare
       `agledger/agledger`, so the keygen pod is the same build the chart is
       about to deploy (tag, or digest when pinned). An untagged reference
       resolves to :latest, and the generator is not version-neutral: only
       builds that carry --algorithm can emit an ES256 key, so a FIPS operator
       on a pinned older chart would otherwise get a silent Ed25519 key. */}}
  {{- fail (printf "secrets.vaultSigningKey is required on first install. Generate a key:\n  kubectl run keygen --rm -it --restart=Never --image=%s --command -- /nodejs/bin/node dist/scripts/generate-signing-key.js\nWrite the VAULT_SIGNING_KEY value it prints to a file and re-run with:\n  umask 077 && printf '%%s' '<key>' > vault-signing-key\n  --set-file secrets.vaultSigningKey=./vault-signing-key\n(--set-file, not --set: an argument is readable by every local user through ps for the length of the install, and this key signs every record on the chain.)\nOr use the guided quick-start, which generates the key and installs in one step:\n  curl -fsSL https://agledger.ai/helm-install.sh | bash" (include "agledger.image" .)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agledger.fullname" . }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  API_KEY_SECRET: {{ $apiKeySecret | quote }}
  VAULT_SIGNING_KEY: {{ $vaultSigningKey | quote }}
  {{- if .Values.secrets.webhookEncryptionKey }}
  WEBHOOK_ENCRYPTION_KEY: {{ .Values.secrets.webhookEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.database.externalUrl }}
  DATABASE_URL: {{ .Values.database.externalUrl | quote }}
  {{- else if .Values.postgres.bundled.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  # checkov:skip=CKV_SECRET_4: helm template placeholder, not a literal credential
  DATABASE_URL: {{ printf "postgresql://agledger:%s@%s-postgres:5432/agledger" $pgPassword (include "agledger.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrlMigrate }}
  DATABASE_URL_MIGRATE: {{ .Values.secrets.databaseUrlMigrate | quote }}
  {{- end }}
  {{- if .Values.secrets.licenseKey }}
  AGLEDGER_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKeySecretPrevious }}
  API_KEY_SECRET_PREVIOUS: {{ .Values.secrets.apiKeySecretPrevious | quote }}
  {{- end }}
{{- end }}
