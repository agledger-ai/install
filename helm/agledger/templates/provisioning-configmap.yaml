{{- if (.Values.provisioning).enabled }}
{{- /* Keep subdirs list in sync with _helpers.tpl provisioningVolumeMounts/provisioningVolumes */}}
{{- $subdirs := list "orgs" "agents" "webhooks" "schemas" }}
{{- $hasContent := false }}
{{- range $subdir := $subdirs }}
  {{- if index $.Values.provisioning $subdir }}
    {{- $hasContent = true }}
  {{- end }}
{{- end }}
{{- /* trusted-issuers.yaml is a root-level FILE, not a subdirectory, and is
       rendered from a list of entries rather than filename-keyed content.
       Skipped when an existingConfigMaps.trustedIssuers supplies it. */}}
{{- $inlineIssuers := list }}
{{- if and (.Values.provisioning).trustedIssuers (not (((.Values.provisioning).existingConfigMaps | default dict).trustedIssuers)) }}
  {{- $inlineIssuers = .Values.provisioning.trustedIssuers }}
  {{- $hasContent = true }}
{{- end }}
{{- if $hasContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agledger.provisioningConfigMapName" . }}
  labels:
    {{- include "agledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioning
{{- if .Values.provisioning.immutable }}
immutable: true
{{- end }}
data:
  {{- if $inlineIssuers }}
  trusted-issuers.yaml: |
    trusted_issuers:
      {{- toYaml $inlineIssuers | nindent 6 }}
  {{- end }}
  {{- range $subdir := $subdirs }}
  {{- range $key, $value := index $.Values.provisioning $subdir }}
  {{ printf "%s--%s" $subdir $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
