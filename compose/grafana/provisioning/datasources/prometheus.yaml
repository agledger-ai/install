apiVersion: 1

# Removed by name before the datasource below is provisioned, and the pair is
# load-bearing on an UPGRADE. An install made before the `uid` was pinned
# created this datasource with Grafana's generated uid (PBFA97CFB590B2093),
# and that row lives in the grafana-data volume, which survives the upgrade.
# Grafana's provisioner resolves the declared datasource by uid, does not find
# the row under the new one, and fails the whole `provisioning` module with
# "Datasource provisioning error: data source not found". The module is fatal,
# so the container crash-loops and the upgrade fails on Grafana alone with the
# engine already upgraded correctly.
#
# Deleting first turns that reconcile into an insert, which has no such
# problem. On a fresh volume the delete is a no-op, and the dashboards this
# stack ships are unaffected: they select the datasource by the `prometheus`
# uid this file declares, not by the row's identity.
#
# What a delete DOES cost, stated rather than papered over: anything an
# operator built inside Grafana that stored the OLD generated uid (an alert
# rule, an annotation query, a library panel) is not re-linked to the new row
# and starts answering "data source not found" in Grafana's own UI while the
# container reports healthy. `editable: false` does not protect those; it only
# refuses edits to this datasource's own connection settings. The bundled
# stack does not intend that workflow (the shipped alert rules are evaluated
# by Prometheus, and `deploy/monitoring/README.md` says so), and the
# alternative is the crash-loop above, which costs the whole monitoring stack
# instead of a link an operator can repoint.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, not left to Grafana. Without a uid here Grafana generates one
    # (PBFA97CFB590B2093 on 13.2.1) and the dashboards' `${datasource}`
    # variable has nothing stable to default to. The same literal is what the
    # Kubernetes sidecar path and a manual import resolve against.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
