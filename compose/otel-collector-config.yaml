receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: basic

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # The `agledger_*` namespace reaches Prometheus by direct scrape of each
  # process's own /metrics, and must not also reach it through here.
  #
  # Every metric the engine records itself is emitted twice: once into
  # @prometheus-io/client, which serves /metrics, and once over OTLP into this
  # collector. Both copies carry the bucket boundaries the code declares, so
  # they agree on every value; what they are not is independent. prometheus.yml
  # scrapes the app AND this collector, so an expression with no `job=` filter
  # sums one series with its own duplicate and every counter reads double.
  #
  # Dropping the namespace here leaves exactly one producer per series, which is
  # what makes the shipped dashboards and alert rules correct without a `job=`
  # filter on every expression (they also render on Kubernetes, where the job
  # label is the release's Service name and no fixed filter would match).
  #
  # What still reaches :8889 is everything that is NOT ours: the
  # auto-instrumentation metrics the OpenTelemetry SDK produces for HTTP and
  # PostgreSQL, which nothing else scrapes.
  #
  # Remove this processor from the pipeline below to feed a backend of your own
  # from here rather than from /metrics. The histograms that arrive that way
  # carry the boundaries the code declares, in the unit the metric name states.
  filter/drop-app-prometheus-namespace:
    metrics:
      exclude:
        match_type: regexp
        metric_names:
          - '^agledger_.*'

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [filter/drop-app-prometheus-namespace, batch]
      exporters: [prometheus]
