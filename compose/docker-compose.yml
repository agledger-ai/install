# =============================================================================
# AGLedger — Self-Hosted Docker Compose
# =============================================================================
# API server, background worker, and database migrations.
#
# Bundled PostgreSQL (default — eval/dev):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --wait
#
# External database (Aurora, RDS, Cloud SQL, Azure):
#   # Set DATABASE_URL in .env, then:
#   docker compose up -d --wait
#
# Single-container (runs migrations on startup):
#   docker run -e DATABASE_URL=... -e RUN_MIGRATIONS=true agledger/agledger
#
# Production (bundled PG):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.prod.yml up -d --wait
#
# Production (external DB):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# With monitoring (Jaeger, Prometheus, Grafana):
#   docker compose --profile monitoring -f docker-compose.yml -f docker-compose.postgres.yml up -d --wait
# =============================================================================

services:
  # --- Database migrations ---

  agledger-migrate:
    image: ${AGLEDGER_IMAGE_PIN:-${AGLEDGER_IMAGE:-agledger/agledger}:${AGLEDGER_VERSION:-latest}}
    init: true
    command: ['dist/src/db/migrate.js']
    restart: 'no'
    environment:
      # The bundled-PG fallback carries no password default, matching the
      # overlay that provides that database. Neither file refuses an empty
      # value: the refusal is the postgres entrypoint's, and it happens only
      # when it would initialize a new data directory.
      #
      # Do NOT "fix" this with `:?`. Compose interpolates nested expressions
      # EAGERLY, so a `:?` here fires even when DATABASE_URL is set and this
      # whole branch is discarded, breaking every external-database install.
      # (The overlay avoids `:?` for a different reason, in its own comment:
      # parse-time resolution would kill `down`/`ps`/`logs` too.) Both are
      # pinned by install-preflight guards in the API build that run
      # real `docker compose config`.
      - DATABASE_URL=${DATABASE_URL_MIGRATE:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-agledger}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-agledger}}}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      # Post-v1.0: shipped migrations are immutable; refuse any baseline checksum rebase.
      - AGLEDGER_LAUNCH_FROZEN=${AGLEDGER_LAUNCH_FROZEN:-true}
      # Knobs for the migration run. This service carries no env_file, so a
      # value in .env reaches it only by being named here, and .env.example
      # documents all five as settable, so name every one of them or the
      # documentation is unfollowable on this path (the chart has this same gap).
      # (api and worker do carry env_file, so they see them
      # too, and the api honours them under RUN_MIGRATIONS=true.) These render
      # as EMPTY strings when unset, which applySessionSafety treats as unset
      # via `||`; see the warning there.
      - MIGRATION_STATEMENT_TIMEOUT=${MIGRATION_STATEMENT_TIMEOUT:-}
      - MIGRATION_LOCK_TIMEOUT=${MIGRATION_LOCK_TIMEOUT:-}
      - MIGRATION_IDLE_IN_TX_TIMEOUT=${MIGRATION_IDLE_IN_TX_TIMEOUT:-}
      # Sizing lever for an index-building migration, and the recovery lever
      # for an install left holding an invalid index. Without these two named
      # here, an operator who sets them in .env gets no error and no effect.
      - MIGRATION_MAINTENANCE_WORK_MEM=${MIGRATION_MAINTENANCE_WORK_MEM:-}
      - AGLEDGER_ALLOW_INVALID_INDEXES=${AGLEDGER_ALLOW_INVALID_INDEXES:-}

  # --- API server ---

  agledger-api:
    image: ${AGLEDGER_IMAGE_PIN:-${AGLEDGER_IMAGE:-agledger/agledger}:${AGLEDGER_VERSION:-latest}}
    init: true
    # Docker's default grace period is 10s. Both processes meter their own
    # shutdown against a 25s drain budget and force-exit at it, so the default
    # SIGKILLs them two thirds of the way through: in-flight requests severed,
    # the last SIEM export batch dropped, the database pool never released.
    #
    # 60s is well above the 30s that budget strictly needs. That headroom is
    # close to free: this is a MAXIMUM wait, not a delay. An idle process still
    # exits in well under a second, and the extra is spent only when a process
    # is genuinely stuck, which is when you want to spend it. The cost of
    # sizing it tight is a SIGKILL mid-drain; the cost of sizing it loose is a
    # slower `compose down` on an already-broken container.
    #
    # Lowering it re-opens that gap, and unlike the Helm chart there is no
    # render-time guard here to refuse a value that does not fit. Helm's
    # equivalent is terminationGracePeriodSeconds (70 worker / 90 api).
    stop_grace_period: 60s
    ports:
      # Host side is a variable so a second stack can run beside the first on
      # one host (COMPOSE_PROJECT_NAME isolates containers and volumes, not
      # host ports). Change it in .env, together with AGLEDGER_EXTERNAL_URL,
      # which is the issuer signed into every record.
      - '127.0.0.1:${AGLEDGER_HOST_PORT:-3001}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-agledger}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-agledger}}
      - ALLOW_DB_WITHOUT_SSL=${ALLOW_DB_WITHOUT_SSL:-false}
    depends_on:
      agledger-migrate:
        condition: service_completed_successfully
    # /health/ready, not /health. `/health` is a static 200 that opens no
    # connection, so a container pointed at a database that is down, gone or
    # refusing its credentials reported healthy: `upgrade.sh` runs
    # `up -d --wait`, which passed, and the first request then 500'd. The
    # readiness endpoint runs `SELECT 1`, and either it answers 503 or the query
    # does not come back and this probe's own 5s timeout ends it. Both read as
    # unhealthy, which is what --wait needs. Its own OpenAPI description names
    # Docker Compose healthchecks as the intended caller.
    #
    # start_period is what keeps this from flapping at boot: failures inside it
    # do not count toward `retries`, and the API only starts after
    # agledger-migrate exits successfully, so Postgres is already accepting
    # connections by the time the first probe runs. 20s covers the pool's first
    # connect on a cold host without buying a slow `--wait` on a healthy one.
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://localhost:3000/health/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Background worker ---

  agledger-worker:
    image: ${AGLEDGER_IMAGE_PIN:-${AGLEDGER_IMAGE:-agledger/agledger}:${AGLEDGER_VERSION:-latest}}
    init: true
    # See agledger-api above: 25s drain budget needs more than Docker's 10s default.
    stop_grace_period: 60s
    # The worker overrides the image CMD, so it must carry the Node 24
    # Permission Model flags itself (the API inherits them from the Dockerfile
    # CMD). Same profile: deny writes + child-process/worker/addons/wasi/
    # inspector; network is ungated. File SIEM sink → add
    # --allow-fs-write=/var/log/agledger here too.
    command: ['--permission', '--allow-fs-read=*', 'dist/src/worker.js']
    # No `ports:` mapping on purpose. The worker's health endpoint is reached
    # in-container by the healthcheck below, so publishing it to the host buys
    # nothing and a fixed host port makes `--scale agledger-worker=N` fail on a
    # collision. To reach worker health from the host, add a mapping in an
    # override file.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-agledger}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-agledger}}
      - ALLOW_DB_WITHOUT_SSL=${ALLOW_DB_WITHOUT_SSL:-false}
      - WORKER_HEALTH_PORT=3001
    depends_on:
      agledger-migrate:
        condition: service_completed_successfully
    # /health/ready for the same reason the API uses it. The worker serves it on
    # this port and races the pool query against its own 2s deadline, so an
    # unreachable primary over a live socket answers 503 here rather than
    # running out this probe's timeout. `/health` on this port reports only that
    # the process is up and draining or not.
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', '-e', "fetch('http://localhost:3001/health/ready').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # --- Monitoring (optional, enable with --profile monitoring) ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: [monitoring]
    # Same restart policy the app services carry in docker-compose.prod.yml. The
    # app is configured to export at this collector permanently, so a collector
    # that does not come back after a host or daemon restart leaves the app
    # logging export failures with nowhere to send telemetry.
    restart: unless-stopped
    command: ['--config', '/etc/otel/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    # Loopback-bound, like the api and postgres services above. None of the
    # monitoring stack authenticates an OTLP receiver or a read-only UI, so a
    # host-wide bind publishes the trace stream and the metrics to anything that
    # can reach the host. Front them with the same reverse proxy that terminates
    # TLS for the API if they need to be reachable off-box.
    ports:
      - '127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317'        # OTLP gRPC
      - '127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318'        # OTLP HTTP
      - '127.0.0.1:${OTEL_METRICS_HOST_PORT:-8889}:8889'     # Prometheus metrics exporter
    depends_on:
      - jaeger
    # No `healthcheck:` here, and it is not an oversight. A Docker healthcheck
    # runs a command INSIDE the container, and this image carries the collector
    # binary and its certificates: no shell, no wget, no curl, nothing that can
    # call an endpoint (`--entrypoint /bin/ls` fails with "no such file"). The
    # other three monitoring services all carry busybox or curl and are probed
    # below.
    #
    # What covers a crash loop here is install.sh's post-start check: `up -d
    # --wait` treats a container with no healthcheck as ready the moment it is
    # running, which a crash-looping container is between restarts, so the
    # installer asks the container states directly afterwards and reports any
    # service that is restarting, exited or unhealthy. A collector that is
    # running and silently dropping every batch is not covered by anything: it
    # exports no telemetry about itself that this stack scrapes.

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - '127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686'  # Jaeger UI
    # The collector reaches these over the compose network, so they belong in
    # `expose`. Listed under `ports` they were single-value entries, which
    # publishes each on a random host port on every interface: the opposite of
    # what the comment claimed.
    expose:
      - '4317'         # OTLP gRPC (internal, OTel collector to Jaeger)
      - '4318'         # OTLP HTTP (internal)
    # Jaeger v2 is an OpenTelemetry Collector distribution and answers its
    # health_check extension on 13133 at /status. `/` on that port is a 404, so
    # the path is load-bearing. wget is a busybox applet in this image and is
    # not linked into PATH, hence the explicit /bin/busybox.
    healthcheck:
      test: ['CMD', '/bin/busybox', 'wget', '--spider', '-q', '-T', '3', 'http://localhost:13133/status']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Rule files are referenced by prometheus.yml `rule_files`.
      - ../monitoring/alerts:/etc/prometheus/alerts:ro
    # /metrics is gated under NODE_ENV=production. prometheus.yml reads the
    # bearer token from this file rather than carrying it inline, so .env stays
    # the only place the secret is written. install.sh generates it.
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics-token
        # 0444, not 0440. Compose materializes an inline config as root-owned
        # and this image runs as `nobody`, so a group-only mode is unreadable:
        # every target reports down with "unable to read authorization
        # credentials ... permission denied". World-readable inside a container
        # whose only other content is Prometheus itself costs nothing.
        mode: 0444
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'
    # A typo in prometheus.yml (the file monitoring/README.md invites operators
    # to edit) makes this container exit at config load and restart forever,
    # and without a healthcheck the installer reported the whole stack up. wget
    # is on PATH in this busybox-based image; /-/healthy answers 200 as soon as
    # the process has loaded its configuration.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', '-T', '3', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      # No `:-admin` fallback. A default here is indistinguishable from a chosen
      # password, and it was the value install.sh then printed as the login.
      # install.sh generates one into .env under --with-monitoring; an operator
      # enabling the profile by hand sets it themselves.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3003}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # /api/health reports the database check as well as the process, so a
    # Grafana that came up onto an unreadable grafana-data volume reads
    # unhealthy rather than ready. start_period is longer than the others
    # because a first boot migrates its own SQLite database before it listens.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '3', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  grafana-data:

configs:
  metrics_token:
    # The fallback is not cosmetic. An EMPTY `content:` is dropped from the
    # rendered config, and Docker then bind-mounts the whole compose project
    # directory at the target path: `.env` and every secret in it, inside the
    # Prometheus container. A non-empty placeholder keeps this a file. It is not
    # a working credential, so a Server with no METRICS_AUTH_TOKEN set answers
    # the scrape 401 and Prometheus shows the target as down, which is the
    # correct signal for "no token configured".
    content: ${METRICS_AUTH_TOKEN:-no-metrics-token-set-see-.env}
