global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Services are discovered by DNS rather than listed as static targets. Compose's
# embedded DNS returns one A record per replica, so `--scale` produces one
# Prometheus target per container with a distinct `instance` label. A static
# target on the service name collapses them into a single series identity that
# round-robins between processes, which makes counters appear to decrease and
# breaks every rate()/increase() the shipped dashboards are built on.
#
# Only agledger-worker can scale today: agledger-api still publishes a fixed host
# port, so `--scale agledger-api=2` fails on a port collision. It is discovered
# the same way anyway, so dropping that mapping is the only change scaling the
# API would need.
#
# One behavior difference from static_configs: when a service is stopped its
# targets disappear rather than reporting `up == 0`. Alert on `absent(up{job=...})`
# alongside `up == 0` if you add rules; no shipped dashboard uses `up` today.
# Alerting rules ship alongside the dashboards. A silent-drop class is
# defined by nobody looking, so a dashboard alone is the wrong delivery
# mechanism for it. Routing stays a customer decision: no Alertmanager is
# bundled, so these evaluate and surface on Prometheus' own /alerts page until
# an `alerting:` block points them somewhere.
rule_files:
  - /etc/prometheus/alerts/*.rules.yml

scrape_configs:
  - job_name: agledger-api
    dns_sd_configs:
      - names: ['agledger-api']
        type: A
        port: 3000
        refresh_interval: 30s
    metrics_path: /metrics
    scrape_interval: 10s
    # /metrics is gated by default under NODE_ENV=production. The token comes
    # from METRICS_AUTH_TOKEN in .env, projected here as a file by the compose
    # `configs` block, so the secret is not duplicated into this file.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token

  # Worker process exposes its own /metrics on the health port. Federation
  # outbound, webhook delivery, worker_jobs_processed, persist_event_unmapped,
  # and siem_mapper counters fire in this process; without scraping it,
  # operators see HELP/TYPE only on the API-side scrape.
  - job_name: agledger-worker
    dns_sd_configs:
      - names: ['agledger-worker']
        type: A
        port: 3001
        refresh_interval: 30s
    metrics_path: /metrics
    scrape_interval: 10s
    # Same token. The worker's health port serves /metrics behind the same
    # bearer gate; /health and /health/ready stay open for the probes.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token

  # The collector's Prometheus exporter. It carries the OpenTelemetry SDK's own
  # auto-instrumentation metrics for HTTP and PostgreSQL, and NOT the
  # `agledger_*` namespace: each AGLedger process emits the metrics it records
  # twice, to prom-client and over OTLP, and the OTLP copy is re-bucketed onto
  # the SDK's default millisecond boundaries. Scraped alongside the two jobs
  # above it made every unscoped expression sum a correct copy with a wrong one,
  # so a p95 panel read about 4.75 s on an install whose sweeps take 4 ms. The
  # namespace is dropped in otel-collector-config.yaml, where the comment
  # explains it; this job stays for what the collector alone produces, which no
  # shipped dashboard or rule reads yet.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
