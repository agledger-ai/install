# =============================================================================
# AGLedger — Bundled PostgreSQL Overlay
# =============================================================================
# Include this file for local/dev deployments using the bundled database.
# For external databases (Aurora, RDS, Cloud SQL, Azure), omit this file
# and set DATABASE_URL in .env instead.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --wait
#
# That bring-up needs POSTGRES_PASSWORD set in .env. `./scripts/install.sh`
# generates one; this overlay ships no default, because a default here is a
# password published in this repo and initdb would keep it for the life of the
# data directory.
#
# Without one, on a data directory that does not exist yet, the postgres
# entrypoint refuses to initialize. `restart: unless-stopped` then retries it,
# so `up --wait` reports "container is unhealthy" rather than the reason:
# `docker compose logs postgres` has the actual line ("Database is
# uninitialized and superuser password is not specified"). Teardown is
# unaffected, which is the whole reason this is `:-` and not `:?`.
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agledger}
      # Empty default, deliberately, and NOT `:?`.
      #
      # No published default: initdb applies this value once and the data
      # directory then keeps it forever, so shipping a real one here means a
      # stack brought up without install.sh bakes a credential from this repo
      # into its database permanently.
      #
      # Empty is a genuine refusal rather than a weak password. The postgres
      # entrypoint will not initialize a data directory without a password
      # ("Database is uninitialized and superuser password is not specified")
      # and nothing here sets POSTGRES_HOST_AUTH_METHOD, so there is no path
      # from empty to a running fresh database.
      #
      # `:?` would look stricter and is worse: compose resolves variables when
      # it PARSES the file, so it fails every subcommand, not just `up`. That
      # breaks `down -v`, `ps`, `logs` and `exec pg_dump` for anyone whose
      # .env is missing, which is exactly the operator trying to clean up or
      # back up. Refusing to start is recoverable; refusing to be torn down is
      # not.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-agledger}
    ports:
      # Host side is a variable so a second stack can run beside the first on
      # one host. The app reaches Postgres over the compose network, so this
      # mapping exists only for psql/pg_dump from the host and can be moved
      # freely. Container side stays 5432 (DATABASE_URL targets it by service
      # name).
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      # postgres:18-alpine refuses to initialize when data is mounted at the
      # legacy /var/lib/postgresql/data path; the new entrypoint expects the
      # parent dir so it can place data under a major-version-specific subdir.
      # Reverting this breaks every fresh install (testbed F-442 / agledger-api#309).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agledger}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=300s
      - -c
      - log_statement=ddl

  # Add postgres dependency and bundled PG detection to application services
  agledger-migrate:
    depends_on:
      postgres:
        condition: service_healthy

  agledger-api:
    environment:
      - AGLEDGER_PG_BUNDLED=true
      - ALLOW_DB_WITHOUT_SSL=true
      # Bundled PG ships with max_connections=100. The app default (20) already
      # fits a single host (API pool + worker pool + pg-boss). Pinned explicitly
      # here so the bundled-PG sizing is visible and overridable. (F-395)
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy

  agledger-worker:
    environment:
      - AGLEDGER_PG_BUNDLED=true
      - ALLOW_DB_WITHOUT_SSL=true
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-20}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
