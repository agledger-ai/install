# AGLedger Prometheus alerting rules.
#
# A dashboard is the wrong delivery mechanism for a silent-drop class, because
# the failure is defined by nobody looking. These rules are the half that does
# not need an operator in front of a screen.
#
# Load them by pointing Prometheus at this directory:
#
#   rule_files:
#     - /etc/prometheus/alerts/*.rules.yml
#
# The bundled compose stack does this already. Routing is deliberately left to
# the customer: Alertmanager, its receivers and its escalation policy are site
# decisions, and shipping an opinion about who gets paged would be wrong. The
# `severity` labels below are the only hook the rules assume.
#
# Every `expr` here is checked against the live metric registry by
# a coverage test in the API build. An alert on a metric nobody
# emits never fires, which is indistinguishable from a healthy system and is
# strictly worse than a blank panel.

groups:
  # ---------------------------------------------------------------------------
  # Silent drops. Everything here is a fire-and-forget path that swallows its
  # error at runtime: nothing 500s, nothing retries, and the only evidence is
  # the counter. These are the reason this file exists.
  # ---------------------------------------------------------------------------
  - name: agledger-silent-drops
    rules:
      - alert: AGLedgerChainEntryDropped
        # The chain is the product. An audit_vault append that failed and was
        # swallowed means a record transitioned with no chain entry behind it,
        # which offline verification will later report as a break that no
        # amount of investigation can reconstruct.
        expr: increase(agledger_federation_audit_vault_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerchainentrydropped"
          summary: "A federation audit-vault append was dropped"
          description: >-
            {{ $value | printf "%.0f" }} chain append(s) failed and were swallowed in the
            last 15m. The record transitioned and the chain entry never landed, so
            verification will report a break. Check the API logs for the append error and
            run POST /v1/admin/vault/scan to size the damage.

      - alert: AGLedgerAuditTrailDropped
        # persistEvent / post-commit callback losses. The state change is
        # durable and the record OF the state change is gone, so /v1/events and
        # any SIEM fed from it are incomplete.
        expr: |
          (sum(increase(agledger_post_commit_callback_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_federation_outbound_event_persist_dropped_total[15m])) or vector(0))
          + (sum(increase(agledger_cascading_gate_persist_event_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_phase2_enqueue_persist_event_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_federation_forensic_audit_dropped_total[15m])) or vector(0))
          + (sum(increase(agledger_support_bundle_audit_failures_total[15m])) or vector(0)) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgeraudittraildropped"
          summary: "Audit-trail writes are being dropped"
          description: >-
            A state change committed and the event recording it did not. /v1/events and
            anything polling it (SIEM) are missing rows for this window.

      - alert: AGLedgerWorkEnqueueDropped
        # A job that never got queued is work that will never happen. Cascade
        # cancel is the sharpest: a child keeps executing after its parent
        # terminalized.
        expr: |
          (sum(increase(agledger_cascade_cancel_enqueue_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_webhook_enqueue_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_cascading_gate_enqueue_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_phase2_enqueue_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_federation_outbound_enqueue_failed_total[15m])) or vector(0))
          + (sum(increase(agledger_federation_outbound_publish_failures_total[15m])) or vector(0)) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerworkenqueuedropped"
          summary: "Queued work was dropped instead of enqueued"
          description: >-
            An enqueue failed and was swallowed. Cascade-cancel drops leave a child record
            executing after its parent terminalized; webhook and federation drops mean a
            downstream system is never told.

      - alert: AGLedgerGateJobRetriesExhausted
        # The other end of the same story as AGLedgerWorkEnqueueDropped: the job
        # was queued, ran, and still never finished. Federation has carried this
        # alert since April (AGLedgerFederationDeadLettered); the gate worker's
        # two exhaustion counters had no rule, so the same failure inside the
        # engine's own queue was the quiet one.
        expr: |
          (sum(increase(agledger_cascade_rollup_retry_exhausted_total[1h])) or vector(0))
          + (sum(increase(agledger_gate_dlq_advisory_pass_lost_total[1h])) or vector(0)) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgergatejobretriesexhausted"
          summary: "Gate-worker jobs gave up after exhausting their retries"
          description: >-
            A cascade rollup that exhausts its retries on the last child's job leaves the
            parent ACTIVE with every child terminal. If a child failed, the consistency
            sweep fails the parent (or expires it, past its own deadline) five to ten
            minutes after the tree goes quiet, so watch
            agledger_auto_rollup_repaired_parents_total keep pace with
            agledger_auto_rollup_stuck_parents_total and only intervene if it does not.
            If none failed, nothing was lost: the parent waits for its performer's own
            completion and is counted by agledger_delegation_parents_awaiting_own_completion.
            A lost advisory pass leaves the record correctly awaiting its principal, minus
            the advisory annotation, permanently.

      - alert: AGLedgerSiemExportDegraded
        # The compliance feed. A customer discovers this at audit time.
        expr: |
          (sum(increase(agledger_siem_mapper_failures_total[1h])) or vector(0))
          + (sum(increase(agledger_siem_http_batches_dropped_total[1h])) or vector(0))
          + (sum(increase(agledger_siem_file_lines_dropped_total[1h])) or vector(0))
          + (sum(increase(agledger_siem_poll_failures_total[1h])) or vector(0)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiemexportdegraded"
          summary: "SIEM export is dropping records"
          description: >-
            The SIEM feed is lossy. Three of the four terms are permanent loss: a mapper
            failure skips the row and advances the cursor past it, and dropped bus-event
            batches and file lines are gone. agledger_siem_poll_failures_total is the
            exception, retrying from an unadvanced cursor. A sink that merely refused a
            polled batch is not in this rule at all.

      - alert: AGLedgerSiemCollectorRejecting
        # The other half of "the SIEM stopped receiving", and the half the lag
        # gauge and the retry counter cannot separate: a collector that is DOWN
        # and a collector that is REFUSING THIS SERVER'S REQUESTS look identical
        # from agledger_siem_poll_delivery_retries_total, and only one of them
        # recovers without somebody changing a setting.
        #
        # Every status behind this counter is the collector answering on the
        # request's own terms: a body shape it will not take (400 from Splunk's
        # /services/collector/event on an NDJSON body, which is SIEM_HTTP_MODE
        # left at ndjson against an HEC endpoint), a credential it will not
        # accept (401, 403), a path that is not there (404), a body it considers
        # too large (413), or a document it cannot parse (422). Retrying changes
        # none of them, and the poller backs off to its ceiling rather than
        # climbing the ladder.
        #
        # Nothing is LOST while this fires. The cursor does not advance, the
        # rows stay in `events` and `system_audit_log`, and delivery resumes
        # from where it stopped. What IS lost is detection latency, for as long
        # as it takes to fix, which is why this is a warning and not silence.
        # The Server logs the collector's own reply at ERROR once per state
        # change; that line is what says which of the statuses above it is.
        expr: |
          sum by (status) (increase(agledger_siem_http_permanent_rejections_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiemcollectorrejecting"
          summary: "SIEM collector is refusing this Server's batches"
          description: >-
            The SIEM HTTP collector answered {{ $labels.status }} to every batch for the last
            15 minutes. That is the collector rejecting the request rather than being unable
            to take one, so it will not clear by waiting: the poller has backed off to its
            ceiling and is holding the cursor. Nothing is lost, and delivery resumes from the
            same position once the configuration is fixed. Read the Server's own log for the
            collector's reply, logged at ERROR once per state change. 400 on a Splunk HEC
            endpoint means SIEM_HTTP_MODE is still ndjson; 401 and 403 mean the token in
            SIEM_HTTP_AUTH_HEADER; 404 means SIEM_HTTP_URL; 413 means the collector's own body
            limit against SIEM_BATCH_SIZE and SIEM_MAX_EVENT_BYTES.

      - alert: AGLedgerSiemPollerFallingBehind
        # Age of the oldest events or system_audit_log row the poller's cursor
        # has not passed, measured each cycle rather than inferred from how the
        # cycle ended, so it reads the same whether the poller is saturated or
        # blocked behind a long write transaction it must not page over. A
        # poller that stops measuring drops out through the freshness gate
        # below instead, and a cycle that throws is AGLedgerSiemExportDegraded's.
        #
        # `max_over_time`, not the bare gauge: the worker is the process that
        # drains, only one of its replicas holds the cursor row per cycle, and a
        # process that spends a while losing that race publishes nothing new. Sampling the
        # window's maximum keeps the alert on a series that goes quiet or dips
        # between scrapes instead of resetting the `for:` hold every time it does.
        #
        # Gated on the process's own freshness stamp. Only a cycle that held
        # the cursor writes the lag gauge, and @prometheus-io/client serves the
        # last value it was given for the life of the process, so a process
        # that stops winning the cursor, or stops polling, would otherwise
        # publish its last reading until it restarts. No aggregation across
        # processes fixes that: max() keeps the stale high and min() hides a
        # real one. The window equals the `for:` hold, so a reading must be
        # re-measured after the hold began before the rule can fire, and a
        # process that stops measuring clears within the window. At the default
        # settings it is wider than the longest gap between one process's
        # measurements while it holds the cursor: the poll interval, the
        # delivery backoff cap (MAX_DELIVERY_BACKOFF_MS), and a saturated
        # cycle's POLL_CYCLE_MAX_ROWS at SIEM_BATCH_SIZE rows a batch, each
        # batch taking up to POLL_DELIVERY_DEADLINE_MS against a slow sink. An
        # install that sets SIEM_FLUSH_INTERVAL_MS longer than the window, or
        # shrinks SIEM_BATCH_SIZE far enough that a saturated cycle outlasts
        # it, loses this rule.
        #
        # Plain `and`, which matches on every label: the stamp and the lag are
        # unlabelled gauges in one process's registry, so each lag series has
        # exactly one stamp series from the same scrape with the same labels.
        expr: |
          max_over_time(agledger_siem_poll_lag_seconds[5m]) > 300
          and (time() - agledger_siem_poll_lag_updated_timestamp_seconds < 600)
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiempollerfallingbehind"
          summary: "SIEM poller is behind the audit write rate"
          description: >-
            The oldest audit row the SIEM poller has not forwarded is
            {{ $value | printf "%.0f" }}s old on {{ $labels.instance }}. Detection
            latency on auth failures, scope denials and credential changes is at
            least that. A backlog defers rows rather than dropping them; the drop
            counters in AGLedgerSiemExportDegraded cover the other case. Usual
            causes, most likely first: a sink refusing the poll batch (the cursor
            is ack-then-advance, so nothing is lost and nothing arrives, and
            agledger_siem_poll_delivery_retries_total by sink is the first thing
            to check), audit writes outrunning the poller's per-cycle cap, and a
            long-lived transaction holding the visibility watermark back. Check
            agledger_siem_poll_skipped_total and pg_stat_activity for the oldest
            xact_start.

            On the watermark cause specifically: it is min(xact_start) across
            every backend on this DATABASE, any role, so a READ-ONLY transaction
            holds it back just as hard as a writer, and this is expected to fire
            during a routine maintenance window rather than indicating a poller
            fault. pg_dump is the common one: it runs in a REPEATABLE READ
            transaction for the length of the dump and sets its own
            statement_timeout to 0, so no server cap bounds it. A long analytics
            query or a forgotten psql BEGIN does the same. Export resumes on its
            own the moment the transaction ends, and nothing is lost either way:
            the cursor defers rows rather than passing them.
            Confirm before escalating:

              SELECT pid, usename, state, now() - xact_start AS age, left(query, 80)
                FROM pg_stat_activity
               WHERE datname = current_database() AND xact_start IS NOT NULL
               ORDER BY xact_start LIMIT 5;

            If the oldest row's age tracks the lag, that transaction is the
            cause. Nothing bounds the transaction itself:
            idle_in_transaction_session_timeout covers only an IDLE blocker, and
            statement_timeout does not apply to a client that opts out of it.

            Check agledger_siem_poll_ahead_rows_total before treating this as a
            SIEM outage. Past SIEM_MAX_HOLDBACK_SECONDS (default 60) the poller
            delivers the live tail from above the watermark while leaving its
            cursor below it, so rows moving there mean the live tail IS reaching
            the sink and what is behind is the in-order backlog. Auth failures,
            scope denials and cert failures are each written by one autocommit
            INSERT, so they are always in that tail; a row written inside a
            longer transaction that committed after the tail had already moved
            past its start time is not, and waits for the cursor. Those rows are sent a second time when the cursor
            crosses them, which is why push delivery is at-least-once and a
            collector must dedupe on the OCSF metadata.uid.

            A flat counter is NOT by itself evidence that ahead delivery is off.
            It also reads flat once the tail has been caught and nothing new has
            been written above the watermark since, which is the ordinary shape
            of a quiet period behind a long backup: this gauge keeps climbing
            through that, because it measures the age of the oldest row the
            CURSOR has not passed and the cursor is exactly what does not move.
            Confirm SIEM_MAX_HOLDBACK_SECONDS is nonzero and compare against the
            audit write rate before ruling the watermark out.

      - alert: AGLedgerSiemPollerStatsBlanked
        # Below pg_read_all_stats, Postgres blanks other roles' xact_start. A
        # poller that paged anyway would degrade the watermark to now() for that
        # writer and skip its in-flight rows permanently, BEHIND the advanced
        # cursor where measureBacklogSeconds cannot see them: the lag gauge would
        # read 0 through the whole loss and AGLedgerSiemPollerFallingBehind would
        # never fire. It halts instead, so this fires on the halt rather than on
        # a skip that leaves no trace. The halted cycle still holds the cursor
        # and still measures the backlog, so the lag gauge climbs and
        # AGLedgerSiemPollerFallingBehind follows this alert rather than
        # replacing it.
        expr: increase(agledger_siem_poll_skipped_total{reason="stats_blanked"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiempollerstatsblanked"
          summary: "SIEM poller cannot see an in-flight writer's transaction"
          description: >-
            The SIEM poller is running on a role without pg_read_all_stats while another
            role holds a write transaction on the same database. It halted rather than
            page over rows it cannot prove are visible. Grant the poller's role
            pg_read_all_stats, or point DATABASE_URL at a role that already has it.

      - alert: AGLedgerSiemStreamHalted
        # The pull channel's equivalent of AGLedgerSiemPollerStatsBlanked, and
        # NOT covered by it: an install that left SIEM_ENABLED off runs no
        # poller at all, so the poller's series never appear while collectors
        # pull GET /v1/siem/stream, which is registered either way. The route
        # answers 503 rather than serve a
        # page it cannot prove is complete, so a halt is loud on the caller's
        # side too; this is what tells the operator which database setting to
        # change.
        expr: increase(agledger_siem_stream_halted_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiemstreamhalted"
          summary: "SIEM pull stream halted ({{ $labels.reason }})"
          description: >-
            GET /v1/siem/stream refused to serve on {{ $labels.instance }} because it
            could not compute the visibility watermark it pages against
            (reason={{ $labels.reason }}). SIEM collectors pulling this endpoint are
            receiving 503 and are not ingesting. For track_activities_off, set
            track_activities = on. For stats_blanked, grant the Server's role
            pg_read_all_stats. For unreadable, the watermark query came back with no row
            at all, so look at what sits between the Server and Postgres.

      - alert: AGLedgerSiemStreamWatermarkStalled
        # The DEFERRAL alarm, and the one AGLedgerSiemStreamHalted does not
        # cover. The watermark is min(xact_start) over every backend with no
        # write filter, so ANY long transaction on this database holds the
        # ceiling back: pg_dump in deploy/scripts/backup.sh keeps one open for
        # the whole dump, and so do a long anti-wraparound vacuum, a psql
        # session left idle-in-transaction, and the SIEM poller's own drain
        # transaction. The route then answers a well-formed EMPTY 200 that a
        # collector cannot tell from "caught up", with no 503 and no halt
        # counter. Rows are withheld and not lost, so this is a latency alarm:
        # warning, and held long enough that a routine backup does not page.
        #
        # Gated on the process's own freshness stamp. Only a stream request
        # writes the lag gauge, and @prometheus-io/client serves the last value
        # it was given for the life of the process, so a replica that stops
        # receiving collector pulls would otherwise publish its last ceiling
        # until it restarts. The window equals the `for:` hold, so a reading
        # must be re-measured after the hold began before the rule can fire,
        # and a replica that stops being pulled clears within the window. The
        # cost is that a collector pulling a given replica less often than the
        # window never trips it there. Plain `and` for the same reason as the
        # poller rule: one unlabelled stamp per process, same labels as the lag.
        expr: |
          min_over_time(agledger_siem_stream_watermark_lag_seconds[10m]) > 600
          and (time() - agledger_siem_stream_watermark_updated_timestamp_seconds < 600)
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiemstreamwatermarkstalled"
          summary: "SIEM pull stream is withholding rows behind a long transaction"
          description: >-
            The visibility ceiling on {{ $labels.instance }} has been
            {{ $value | printf "%.0f" }}s behind for 10 minutes, so GET /v1/siem/stream
            is serving empty pages while rows accumulate. Find the oldest transaction with
            SELECT pid, usename, state, xact_start FROM pg_stat_activity
            WHERE xact_start IS NOT NULL ORDER BY xact_start LIMIT 5, and end it. Nothing
            is lost; export resumes when it does.

      - alert: AGLedgerSiemStreamStatsRestricted
        # Same pre-failure signal as AGLedgerSiemPollerStatsRestricted, on the
        # gauge the pull channel publishes for itself.
        #
        # Gated on the same freshness stamp as
        # AGLedgerSiemStreamWatermarkStalled, which is written beside this
        # gauge on every stream request. A replica that stops being pulled
        # would otherwise publish its last count until it restarts. The window
        # equals the `for:` hold, so a count must be re-measured after the hold
        # began before the rule can fire, and a replica that stops being pulled
        # clears within the window; a collector pulling a replica less often
        # than that never trips it there. Plain `and`: one unlabelled stamp per
        # process, same labels as the count.
        expr: |
          max_over_time(agledger_siem_stream_blanked_backends[15m]) > 0
          and (time() - agledger_siem_stream_watermark_updated_timestamp_seconds < 1800)
        for: 30m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiemstreamstatsrestricted"
          summary: "SIEM pull stream has restricted visibility into pg_stat_activity"
          description: >-
            {{ $value | printf "%.0f" }} same-database backend(s) are invisible to the
            Server's role on {{ $labels.instance }}. GET /v1/siem/stream serves correctly
            while they stay read-only and halts with 503 as soon as one writes. Grant
            pg_read_all_stats.

      - alert: AGLedgerSiemPollerStatsRestricted
        # The pre-failure signal. Blanked backends alone are harmless, since a
        # read-only session can skip nothing, but they say the poller is on a
        # role that will halt the moment one of them writes. Warning with a long
        # hold: this is a standing configuration fact, not an event.
        #
        # Gated on the gauge's own freshness stamp, which every poll batch
        # that held the cursor and read the watermark writes beside it. A
        # process that stops winning the cursor, or whose poller halts on
        # track_activities before reaching this gauge, would otherwise publish
        # its last count until it restarts. The window equals the `for:` hold,
        # so a count must be re-measured after the hold began before the rule
        # can fire, and a process that stops measuring clears within the
        # window. At default settings it sits far above the gap between one
        # process's batches while it holds the cursor, which the poll interval,
        # the delivery backoff cap and one batch's delivery deadline bound; an
        # install that sets SIEM_FLUSH_INTERVAL_MS longer than the window loses
        # this rule. Plain `and`: one
        # unlabelled stamp per process, same labels as the count.
        expr: |
          max_over_time(agledger_siem_poll_blanked_backends[15m]) > 0
          and (time() - agledger_siem_poll_blanked_backends_updated_timestamp_seconds < 1800)
        for: 30m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgersiempollerstatsrestricted"
          summary: "SIEM poller has restricted visibility into pg_stat_activity"
          description: >-
            {{ $value | printf "%.0f" }} same-database backend(s) are invisible to the
            SIEM poller's role on {{ $labels.instance }}. Export is correct while they
            stay read-only and halts as soon as one writes. Grant pg_read_all_stats.

      - alert: AGLedgerRateLimitStoreFailing
        # @fastify/rate-limit is configured with `skipOnError`, so a store query
        # that throws lets the request through. Rate limiting is then off and
        # every symptom of it being on is absent: no 429s, no errors, no latency
        # change. The counter is the only thing that says so.
        expr: increase(agledger_rate_limit_store_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerratelimitstorefailing"
          summary: "The rate-limit store is failing and requests are passing unlimited"
          description: >-
            {{ $value | printf "%.0f" }} store failure(s) in the last 15m on
            {{ $labels.instance }}. With skipOnError the request is allowed through, so this
            API is serving unthrottled. Usual causes are a missing `rate_limits` table, a
            missing GRANT on it, or the table living in a schema off the search_path.

      - alert: AGLedgerConfigReloadFailing
        # Config that silently did not take. The operator edited a file, saw no
        # error, and is running something else.
        expr: |
          (sum(increase(agledger_provisioning_reload_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_llms_txt_customization_load_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_schema_warmcache_refresh_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_rate_limit_exemption_rebuild_failures_total[15m])) or vector(0))
          + (sum(increase(agledger_cache_invalidation_drops_total[15m])) or vector(0)) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerconfigreloadfailing"
          summary: "A config reload or cache refresh is failing"
          description: >-
            The running configuration may not match what is on disk, and replicas may be
            serving stale schemas.

      - alert: AGLedgerCacheInvalidationListenerDown
        # The rule above counts invalidations that arrived and could not be
        # applied. A process whose LISTEN session is down receives none, so
        # nothing there moves, and the reconnect-failure counter moves only on
        # an attempt that fails: this gauge is the one reading that holds for
        # the whole outage. Per instance, because each process holds its own
        # session and one down is one replica serving stale caches.
        expr: min by (instance, channel) (agledger_pg_listener_connected) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgercacheinvalidationlistenerdown"
          summary: "{{ $labels.instance }} is not hearing cache invalidations"
          description: >-
            The {{ $labels.channel }} LISTEN session on {{ $labels.instance }} has been down for
            5 minutes. Key revocations, signing-key retirements, rewind detections and
            rate-limit exemption changes made on another replica reach it only when each
            cache expires or is re-read, or when the session reconnects.

      - alert: AGLedgerProvisioningErrors
        # A partial provision: some files or entries did not load or apply,
        # everything else did, and the Server runs healthy without them. The
        # rule above sees only a reload that threw. Each API process reports
        # its own last run, and a run that lost the lock to another replica
        # leaves its readings alone, so `max` is the replica that last found
        # the directory broken.
        expr: max by (stage) (agledger_provisioning_errors) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerprovisioningerrors"
          summary: "The provisioning directory did not fully {{ if eq $labels.stage \"load\" }}load{{ else }}apply{{ end }}"
          description: >-
            {{ $value | printf "%.0f" }} provisioning error(s) at the {{ $labels.stage }} stage
            on the last run. The resources they name are missing from the running install,
            and while any are at the load stage, prune is suppressed.

      - alert: AGLedgerOidcJtiReplayBurst
        # A verified token presented twice. Every other refusal in this file is
        # a credential that did not check out; this one did, which is why the
        # threshold is a burst rather than a single event: a client that cannot
        # mint a token per request produces a steady trickle the operator has
        # already decided to live with by leaving jtiSingleUse on, and a capture
        # being replayed produces a rate that client never had.
        #
        # `reason="replayed"` only. The other value this counter carries,
        # `jti_unregistrable`, is an oversized jti the register refused, which
        # is a client defect and not a replay.
        #
        # Summed, because the threshold is a rate claim and the API process
        # publishes this counter. A load balancer spreads one client's requests
        # over every API replica, so a bare `increase()` divides the burst by
        # `api.replicaCount`: at three replicas a capture being replayed
        # fifteen times in ten minutes reads as five on each series and reaches
        # the threshold on none of them. `by (reason)` keeps the label the
        # selector pins, which is what the runbook's own breakdown query
        # groups on.
        expr: sum by (reason) (increase(agledger_oidc_admin_jti_replays_total{reason="replayed"}[10m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgeroidcjtireplayburst"
          summary: "Admin OIDC bearers are being replayed"
          description: >-
            {{ $value | printf "%.0f" }} single-use admin bearer(s) were presented a second
            time in the last 10m. The tokens verified, so a real credential from a trusted
            IdP is being reused: either a client that holds one token for a session, or a
            captured bearer. The paired auth.failed rows carry the issuer and the subject.

      - alert: AGLedgerOidcSingleUseUnenforceable
        # The flag that is on and enforcing nothing. A trusted_issuers row with
        # jti_single_use set admits every presentation when the token resolves
        # no id, so the operator who turned it on is reading the replay counter
        # above at a healthy zero for the wrong reason.
        #
        # `> 0` over an hour, not a burst, because unlike a replay there is no
        # rate at which this is acceptable: one admission proves the row cannot
        # enforce what it promises, and the hour is only there to keep a single
        # misconfigured client from paging on every request.
        expr: increase(agledger_oidc_admin_jti_unenforceable_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgeroidcsingleuseunenforceable"
          summary: "A single-use trusted issuer is admitting reusable bearers"
          description: >-
            {{ $value | printf "%.0f" }} admin bearer(s) were admitted in the last hour on a
            trusted_issuers row with jtiSingleUse set, because the token carried no jti and the
            row maps no claim to resolve one from. Single use is enforcing nothing on that row.
            Entra ID mints uti rather than jti: add claimMapping {"jti":"uti"}. Auth0's default
            access-token profile mints neither: switch that API to the RFC 9068 profile. Or clear
            jtiSingleUse so the row says what it does.

      - alert: AGLedgerOidcSubjectRefusalBurst
        # The allowlist working is one refusal when someone's access is pulled.
        # A burst is the other reading: an identity the operator excluded
        # trying repeatedly, or an IdP projecting subjects this Server was never
        # told about. All three doors count here because the same excluded
        # subject can walk up to any of them with the same token.
        expr: |
          (sum(increase(agledger_oidc_admin_subject_refusals_total[15m])) or vector(0))
          + (sum(increase(agledger_oidc_cert_exchange_refusals_total{reason="oidc_subject_not_allowlisted"}[15m])) or vector(0))
          + (sum(increase(agledger_oidc_delegation_refusals_total{reason="oidc_subject_not_allowlisted"}[15m])) or vector(0)) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgeroidcsubjectrefusalburst"
          summary: "Subjects a trusted issuer does not list are presenting valid tokens"
          description: >-
            {{ $value | printf "%.0f" }} subject-allowlist refusal(s) across the admin bearer
            path, the cert exchange and the delegated on-behalf-of path in the last 15m. The
            tokens verified against a registered trusted issuer and the subject is not on its
            list. Either an IdP is issuing to principals this Server was not told about, or
            somebody excluded is still trying.

  # ---------------------------------------------------------------------------
  # Chain integrity. Distinct from a dropped append: these fire when the chain
  # that IS there fails to verify.
  # ---------------------------------------------------------------------------
  - name: agledger-chain-integrity
    rules:
      - alert: AGLedgerVaultIntegrityCheckFailed
        expr: increase(agledger_vault_integrity_check_results_total{result="broken"}[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          # The selector is `result="broken"`, not `result!="pass"`. The check
          # emits exactly two values, `clean` and `broken`, so excluding a third
          # that nothing emits excluded nothing: this fired CRITICAL on every
          # healthy scan.
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultintegritycheckfailed"
          summary: "Vault integrity check reported a broken chain"
          description: >-
            The hash chain or the key registry did not verify (a standing registry finding,
            whose remedy is already carried out, does not count). Do not restart into this:
            capture the state first, then GET /v1/admin/vault/scan for the affected range.

      - alert: AGLedgerVaultKeyWindowViolation
        # An entry signed outside its key's published window does not stop the
        # chain being checkpointed, so the integrity check above can stay
        # clean while an offline verifier fails every export carrying it with
        # CHAIN_KEY_EXPIRED or CHAIN_KEY_NOT_YET_ACTIVE.
        expr: sum by (reason) (increase(agledger_vault_key_window_violations_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultkeywindowviolation"
          summary: "A chain carries an entry signed outside its key's published window"
          description: >-
            Offline verification of the affected records fails with CHAIN_KEY_EXPIRED or
            CHAIN_KEY_NOT_YET_ACTIVE. Run POST /v1/admin/vault/scan and read the reason on
            each broken chain; reason signing_key_distrusted counts chains carrying an
            entry a VAULT_DISTRUSTED_KEYS key signed after its distrust instant and before
            its retirement, listed under distrustedEntries.

      - alert: AGLedgerChainWritesRefused
        # A detected rewind refuses every chain write with a 409 until an
        # operator acknowledges it. A 409 is a client error to every other rule
        # here, so AGLedgerHighErrorRate never sees it, and the refusal counter
        # moves only when something tries to write. The gauge is each process's
        # own flag, re-read from the database every 30 seconds, so it reads 1 on
        # a Server nobody is writing to. max, not per instance: every process
        # reads the same row, and one page is the answer.
        expr: max(agledger_chain_writes_refused) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerchainwritesrefused"
          summary: "This Server refuses every chain write until a detected rewind is acknowledged"
          description: >-
            External anchors hold a chain position past the one this database is on, which
            is what a restore to an earlier backup leaves behind. Records, completions,
            verdicts and every other chain write answer 409 until an operator reads GET
            /v1/admin/vault/rewind and acknowledges at POST /v1/admin/vault/rewind/acknowledge.

      - alert: AGLedgerVaultAnchorsNotLanding
        # A checkpoint whose S3 anchor did not upload stays queued, and every
        # checkpoint run retries it. Past two intervals plus an hour, at least
        # two retries have failed: the store is unreachable, or refusing this
        # Server's writes. Every API replica reads the same table on the same
        # refresh, so `max` is the install. The interval is read from its own
        # gauge because it is configurable. Both read 0 while anchoring is off,
        # when nothing retries the queue.
        expr: |
          max(agledger_vault_anchor_pending_oldest_age_seconds)
            > 2 * max(agledger_vault_anchor_interval_seconds) + 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultanchorsnotlanding"
          summary: "Vault checkpoints are not reaching the anchor store"
          description: >-
            The oldest checkpoint waiting for its S3 anchor was written over two checkpoint
            intervals ago, so retries are failing. Its entries have no evidence outside the
            database until one lands.

      - alert: AGLedgerCheckpointSkippedBrokenChain
        expr: increase(agledger_vault_checkpoint_skipped_broken_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgercheckpointskippedbrokenchain"
          summary: "A vault checkpoint was skipped because the chain is broken"
          description: >-
            Checkpointing refused rather than anchoring over a break. Every write after
            this point is unanchored until the break is resolved.

      # Key custody in AWS KMS (VAULT_SIGNING_KEY_KMS_ARN). Both rules read 0
      # forever on an install signing with a local key.
      - alert: AGLedgerVaultSignerUnreachable
        # The gate itself: a process that has stopped signing because KMS did
        # not answer. It fails its readiness probe and refuses every write; the
        # worker holds its fetched jobs. It reopens on its own when a probe Sign
        # is answered, so a short blip clears before `for` elapses.
        expr: max by (instance) (agledger_vault_signer_unreachable) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultsignerunreachable"
          summary: "A process cannot reach the KMS key it signs with and has stopped writing"
          description: >-
            {{ $labels.instance }} refuses every chain append, checkpoint, Receipt,
            signed webhook delivery and certificate until KMS answers a Sign call.
            Check the KMS endpoint from that process, the key's state, and kms:Sign on
            its role.

      - alert: AGLedgerVaultRemoteSignFailing
        # Individual Sign failures below the gate's threshold: each one is a
        # refused write or a failed probe of the signing-key watch (which signs
        # once a pass on every api and worker process, writes or not), and a
        # steady trickle (throttling at the quota, an intermittent path) never
        # trips the gate.
        expr: sum(rate(agledger_vault_remote_sign_seconds_count{outcome="error"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultremotesignfailing"
          summary: "KMS Sign calls are failing"
          description: >-
            Every failed Sign is one write answered 503. The process log names the AWS
            error on each; ThrottlingException means the account's Sign quota, and
            VAULT_SIGNING_REMOTE_MAX_PER_SECOND summed across replicas should sit under it.

  # ---------------------------------------------------------------------------
  # Partition maintenance. The daily job (02:00 UTC) creates three months of
  # monthly partitions ahead on audit_vault, events, webhook_deliveries and
  # system_audit_log. If it stops, nothing degrades and nothing errors until the
  # runway reaches zero, at which point INSERTs fail outright with
  # `no partition of relation "audit_vault" found for row` and the chain stops
  # accepting appends.
  #
  # The runway and default-rows gauges below answer "how much room is left".
  # They do NOT answer "is the job still running": @prometheus-io/client holds
  # a gauge's last value for the life of the process, so a job that stopped
  # extending anything keeps serving a healthy 92 on every scrape. That is why
  # the two liveness rules come first. AGLedgerWorkerJobsFailing does not cover
  # this either, at one daily failure against ~1440 successes a day.
  # ---------------------------------------------------------------------------
  - name: agledger-partitions
    rules:
      - alert: AGLedgerPartitionMaintenanceFailing
        # The direct reading of a job that is not keeping up.
        # ensure_future_partitions() isolates each table in its own
        # subtransaction and increments this counter once per table it could not
        # extend, so one stuck table does not take the other three down with
        # it. The counter therefore reads "at least one table gained nothing"
        # rather than "nothing gained anything". Two other sites increment it
        # and neither can name a table: the call failing outright before the
        # function returns anything, and the gauge refresh that follows it. The
        # log line is what tells the three apart.
        # 25h, not 15m, because the job runs once a day and a shorter window
        # resolves the alert before anyone reads it.
        expr: increase(agledger_partition_management_failures_total[25h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitionmaintenancefailing"
          summary: "The daily partition-management job is failing"
          description: >-
            At least one partitioned table gained no runway on the last run, or the runway
            gauges could not be refreshed. Runway is draining on whatever failed and the
            gauges may be reporting the last healthy reading. Check the worker log: a
            single table that could not be extended is logged with its name and the
            Postgres error, while a call that failed outright, on a lock wait or a lost
            connection, is logged without one and means no table gained runway at all.

      - alert: AGLedgerPartitionMaintenanceSkipped
        # The third state, and the one neither rule either side of it can see.
        # The sweep takes pg_try_advisory_xact_lock so a second copy is a no-op
        # instead of a duplicate CREATE TABLE that reports a false failure. A
        # skipped cycle therefore increments nothing above, and it still
        # refreshes the runway gauges and their freshness stamp, so the
        # not-running rule below stays green while no partition is being
        # created.
        #
        # Two, not one. One skip is the guard working: a lease retry arriving
        # while the original cycle is still going is exactly what it is for.
        # Two is a lock held across two daily ticks, which nothing healthy does,
        # because the lock is transaction-scoped and a cycle takes seconds. The
        # reachable cause is a backend wedged inside ensure_future_partitions,
        # where statement_timeout is deliberately 0 and the session is never
        # idle in transaction, so neither database timeout ends it.
        #
        # 49h covers two consecutive daily ticks with an hour of slack for a
        # tick that slid. Anything shorter can hold only one tick and could
        # never reach two.
        #
        # Summed, for the same reason as the sweep rules further down: one cron
        # tick is one job and any worker replica may take it, so two skipped
        # ticks can land on two pods and a bare increase() counts one on each
        # and stays silent. The counter is unlabelled, so there is nothing to
        # group by.
        expr: sum(increase(agledger_partition_management_skipped_total[49h])) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitionmaintenanceskipped"
          summary: "The daily partition-management job keeps yielding to a lock holder"
          description: >-
            {{ $value | printf "%.0f" }} cycle(s) in the last 49h did nothing because
            another copy of the sweep held the advisory lock. Nothing has failed and the
            runway gauges are still being refreshed, so the other partition rules read
            healthy, but no partition is being created either and the runway drains from
            here. Find the holder: pg_locks where locktype = 'advisory' and objid =
            hashtext('partition-management'), joined to pg_stat_activity.

      - alert: AGLedgerPartitionMaintenanceNotRunning
        # The other half: the job is not failing, it is not running. Covers a
        # dead scheduler and a worker that has never completed a run. Every
        # worker boot queues one run, so on a healthy install the gauges are
        # absent for minutes after a restart, not until the next 02:00; `for: 26h`
        # holds both halves to about one missed daily cycle.
        #
        # `max()` over the stamp, not the bare gauge. It is unlabelled, so
        # @prometheus-io/client materializes it at 0 on every worker process at
        # registration, and only the replica that took the daily cron tick ever
        # stamps it. Read per series, a second worker publishes a permanent 0,
        # `time() - 0` is the whole Unix epoch, and the rule pages forever at
        # `worker.replicaCount: 2` on an install whose partition job is
        # perfectly healthy. The question the rule means is whether ANY worker
        # has refreshed recently, which is the freshest stamp across them.
        expr: |
          (time() - max(agledger_partition_gauges_updated_timestamp_seconds) > 129600)
          or absent(agledger_partition_runway_days)
        for: 26h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitionmaintenancenotrunning"
          summary: "Partition-management has not reported in over a day"
          description: >-
            The runway gauges have not been refreshed. Whatever they currently read is
            stale; if they are absent entirely, no worker has completed a run since it
            started, though each worker queues one at boot. Confirm the worker is up, its
            log shows the partition-management run, and its pg-boss schedule still holds
            the partition-management entry.

      - alert: AGLedgerPartitionRunwayLow
        # 31 days is the number the gauge's own help text names. A healthy
        # install sits near 90: the job runs daily and creates three months
        # ahead, so reaching 31 means it has not completed in about two months.
        # `unless` rather than a bare `< 31`: the critical rule below is a
        # strict subset, both `for` windows elapse together, and nothing here
        # ships an Alertmanager inhibit rule, so without this the same table
        # pages twice.
        #
        # `min by (table)`: every worker re-reads the runway every 10 minutes,
        # so replicas agree within that, and where they briefly differ the
        # worst reading wins, so the rule errs toward firing rather than
        # toward silence. A hand refill shows within the same 10 minutes.
        expr: |
          (min by (table) (agledger_partition_runway_days) < 31)
          unless (min by (table) (agledger_partition_runway_days) < 7)
        for: 1h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitionrunwaylow"
          summary: "Partition runway on {{ $labels.table }} is under a month"
          description: >-
            {{ $value | printf "%.0f" }} days of future partitions remain on
            {{ $labels.table }}. The daily partition-management job is not staying ahead.
            Check the worker, then run SELECT ensure_future_partitions(3) to refill.

      - alert: AGLedgerPartitionRunwayExhausted
        # Same gauge, paging threshold. Under a week there is no longer room to
        # schedule the fix, and on audit_vault the failure is a write outage.
        # `min by (table)` for the reason given on the warning rule above.
        expr: min by (table) (agledger_partition_runway_days) < 7
        for: 0m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitionrunwayexhausted"
          summary: "Partition runway on {{ $labels.table }} runs out this week"
          description: >-
            {{ $value | printf "%.0f" }} days left on {{ $labels.table }}. When it reaches
            zero, inserts fail with "no partition of relation found for row"; on audit_vault
            that stops every chain append and with it every state transition. Run
            SELECT ensure_future_partitions(3) now.

      - alert: AGLedgerPartitionDefaultRowsPresent
        # Only system_audit_log has a DEFAULT partition today, so this fires for
        # it alone. A row here is a lag signal rather than a latch:
        # ensure_future_partitions() detaches the default, creates the months,
        # moves the rows that now have a home and re-attaches, so a row for any
        # month within the next three drains itself at the following 02:00. Two
        # situations reach this rule and neither is urgent on its own, which is
        # why it stays a warning:
        #
        #   - A row for a month at or after the earliest monthly partition. The
        #     job resolves it on the next run. Still firing a day later means
        #     the job is not running or not succeeding, and
        #     AGLedgerPartitionMaintenanceFailing or
        #     AGLedgerPartitionMaintenanceNotRunning is the rule that says which.
        #   - A row backdated before the earliest monthly partition, or dated
        #     further ahead than the job creates. Nothing is blocked, because
        #     ensure_future_partitions() only covers CURRENT_DATE through three
        #     months out and would never have created that month.
        #     system_audit_log has a MINVALUE partition below its earliest
        #     month, as its siblings do, so a backdated row lands there rather
        #     than in the default.
        #
        # `max by (table)`, the opposite of the runway rules above and for the
        # same reason: here the unsafe direction is silence, so where replicas
        # briefly differ the highest count wins. Every worker re-reads the
        # count every 10 minutes, so a drained DEFAULT partition clears on all
        # of them within that.
        expr: max by (table) (agledger_partition_default_rows) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerpartitiondefaultrowspresent"
          summary: "Rows are landing in the DEFAULT partition of {{ $labels.table }}"
          description: >-
            {{ $value | printf "%.0f" }} row(s) in the catch-all partition of
            {{ $labels.table }}, which should read zero. Check the created_at of those
            rows. If any fall within the next three months, the nightly job drains them
            into their own partition on its next run, so this should clear by itself; if
            it has not, the job is not running and AGLedgerPartitionMaintenanceFailing or
            AGLedgerPartitionMaintenanceNotRunning will say so. If they are all older than
            the earliest monthly partition, or further ahead than the job creates, nothing
            is blocked and the rows are simply parked.

  # ---------------------------------------------------------------------------
  # Federation delivery. Retries are normal; exhausting them is not.
  # ---------------------------------------------------------------------------
  - name: agledger-federation
    rules:
      - alert: AGLedgerFederationZeroRowNearHorizon
        # A terminal record that should have federated and has no outbound row
        # at all is re-driven by the zero-row sweep, oldest first, for as long
        # as it is younger than the horizon. One older than that leaves the
        # window and never reaches the peer. The oldest candidate's age is the
        # only reading that sees the pool refilling faster than a batch drains.
        #
        # The age comes from the worker that refreshed last: the sweep runs on
        # one replica per tick and the others keep what they read on their last
        # one. And only while that refresh is under 15 minutes old (the sweep
        # runs every 2), so a stopped sweep is AGLedgerMaintenanceSweepFailing's
        # to report and not a frozen age paging here. The horizon is read from
        # its own gauge because it is configurable.
        expr: |
          (
            max by (kind) (
              agledger_federation_zero_row_oldest_candidate_age_seconds
              and on (instance, kind)
              (
                agledger_federation_zero_row_updated_timestamp_seconds
                == on (kind) group_left ()
                max by (kind) (agledger_federation_zero_row_updated_timestamp_seconds)
              )
            )
            / on () group_left () max (agledger_federation_zero_row_horizon_seconds)
          ) > 0.5
          and on (kind)
          (time() - max by (kind) (agledger_federation_zero_row_updated_timestamp_seconds) < 900)
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerfederationzerorownearhorizon"
          summary: "Federation zero-row recovery for {{ $labels.kind }} is past half its horizon"
          description: >-
            The oldest {{ $labels.kind }} record waiting for zero-row recovery is
            {{ $value | humanizePercentage }} of the way to the horizon. Past it, the record
            leaves the sweep's window and never reaches its peers. Raise
            AGLEDGER_FEDERATION_ZERO_ROW_BATCH_SIZE, or find why the live publish path is
            leaving records without an outbound row.

      - alert: AGLedgerFederationDeadLettered
        expr: increase(agledger_federation_outbound_retry_exhausted_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerfederationdeadlettered"
          summary: "Federation jobs exhausted their retries and dead-lettered"
          description: >-
            {{ $value | printf "%.0f" }} outbound job(s) of kind "{{ $labels.kind }}" will
            never reach the peer without an operator redrive. Triage at
            GET /federation/v1/admin/dlq.

      - alert: AGLedgerFederationDeliveriesGivenUp
        # AGLedgerFederationDeadLettered fires once, when a leg exhausts its
        # retries; the recovery sweep then re-enqueues it until a day after it
        # first failed and stops. Past that the leg waits for a manual recover
        # and pg-boss deletes it 14 days after it dead-lettered, so this
        # reads the standing count rather than an event. Every API replica
        # reads the same table, so `max` is the install.
        expr: max(agledger_federation_dlq_jobs{sweep="given_up"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerfederationdeliveriesgivenup"
          summary: "Federation deliveries the recovery sweep has stopped retrying"
          description: >-
            {{ $value | printf "%.0f" }} dead-lettered federation leg(s) first failed over a
            day ago, so the recovery sweep no longer retries them. Each waits for
            POST /federation/v1/admin/dlq/recover, and is lost to its peer when pg-boss
            deletes it.

      - alert: AGLedgerFederationSchemaDigestMismatch
        expr: increase(agledger_federation_schema_digest_mismatch_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerfederationschemadigestmismatch"
          summary: "A peer asserted a schema digest this Server does not hold"
          description: >-
            Operation "{{ $labels.operation }}". The two Servers registered the same
            (publisher, type, version) from different bytes. Re-import the manifest on one
            side so the digests agree.

  # ---------------------------------------------------------------------------
  # Stuck work. Rows that have stopped moving and wait on an operator: nothing
  # in the engine retries them, so a counter reports them once, at the moment
  # they stopped, and the gauges beside these rules report what is still there.
  # ---------------------------------------------------------------------------
  - name: agledger-stuck-work
    rules:
      - alert: AGLedgerWebhooksDeadLettered
        # A dead-lettered delivery stays in webhook_delivery_dlq until an
        # operator retries or discards it; nothing drains it. `paused` and
        # `subscription_inactive` are left out: a pause is the operator's
        # choice, and a subscription goes inactive by delete, provisioning
        # prune, or the engine after the `gone` or `circuit_open` dead letters
        # this rule has already fired on. The standing backlog is
        # agledger_webhook_dlq_entries, the count system-health degrades on.
        expr: |
          sum by (reason) (
            increase(agledger_webhooks_dead_lettered_total{reason!~"paused|subscription_inactive"}[1h])
          ) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerwebhooksdeadlettered"
          summary: "Webhook deliveries dead-lettered ({{ $labels.reason }})"
          description: >-
            {{ $value | printf "%.0f" }} webhook event(s) dead-lettered with reason
            "{{ $labels.reason }}" in the last hour. The receiver never got them and nothing
            retries them. Fix the endpoint, then retry from GET /v1/admin/webhook-dlq.

      - alert: AGLedgerWebhookSubscriptionsNotDelivering
        # An open breaker is skipped at dispatch, so the events it misses are
        # dropped rather than dead-lettered and AGLedgerWebhooksDeadLettered
        # does not see them. breaker_open counts a subscription still failing
        # its probes; disabled counts one the engine deactivated, and holds
        # until an operator closes its breaker, which is the dismissal the
        # health listing offers. `paused` is the owner's choice and is left out.
        # Every API replica reads the same table, so `max` is the install.
        expr: max by (state) (agledger_webhook_subscriptions_not_delivering{state=~"breaker_open|disabled"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerwebhooksubscriptionsnotdelivering"
          summary: "Webhook subscriptions are not taking deliveries ({{ $labels.state }})"
          description: >-
            {{ $value | printf "%.0f" }} webhook subscription(s) in state {{ $labels.state }}.
            Events for them are dropped at dispatch, not dead-lettered, so a receiver recovers
            them only by replaying GET /v1/events. GET /v1/admin/webhooks/health lists them.

      - alert: AGLedgerTrustedIssuerJwksFailing
        # A trusted issuer that cannot fetch its JWKS refuses the tokens it
        # would validate, and the callers see 401s that name the reason while
        # nothing here fired. The gauge counts only a recent failure (its help
        # says how recent): a row that keeps failing is re-recorded while
        # tokens keep arriving, and one no token reaches drops out rather than
        # paging for an IdP that may have recovered. Every API replica reads the same
        # table, so `max` is the install.
        expr: max by (outcome) (agledger_trusted_issuers_jwks_failing) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgertrustedissuerjwksfailing"
          summary: "Trusted issuers cannot fetch their signing keys ({{ $labels.outcome }})"
          description: >-
            {{ $value | printf "%.0f" }} enabled trusted issuer(s) are failing to fetch their
            JWKS with {{ $labels.outcome }}, so tokens they would validate are refused.
            GET /v1/admin/trusted-issuers names them.

      - alert: AGLedgerDisputesStuck
        # A dispute at EVIDENCE_WINDOW is moved on by the evidence-window-expiry
        # sweep once its window closes. window_overdue is one that sweep has
        # not reached past its grace; no_window_close is one with no close
        # instant, which it never will. The dispute-stale-recovery sweep logs
        # both and nothing else reported them. Disputes waiting on the
        # principal (PENDING_RESOLUTION) are agledger_disputes_open, which has
        # no rule: no elapsed time is a fault there. Every API replica reads
        # the same table, so `max` is the install.
        expr: max by (reason) (agledger_disputes_stuck) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerdisputesstuck"
          summary: "Disputes stuck at EVIDENCE_WINDOW ({{ $labels.reason }})"
          description: >-
            {{ $value | printf "%.0f" }} dispute(s) at EVIDENCE_WINDOW the engine should have
            moved to PENDING_RESOLUTION ({{ $labels.reason }}). Their principals are not
            asked to resolve them until they move.

  # ---------------------------------------------------------------------------
  # Availability and saturation. Ordinary service health, included because
  # nothing else here carried it.
  # ---------------------------------------------------------------------------
  - name: agledger-availability
    rules:
      - alert: AGLedgerHighErrorRate
        expr: |
          sum(rate(agledger_http_request_duration_seconds_count{status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(agledger_http_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 10m
        # A 5m ratio crossing back under 5% for one evaluation is the shape of a
        # restart, not a recovery, and a resolve-then-refire reads as two
        # incidents. Hold the alert until it has stayed under for 5m.
        keep_firing_for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerhigherrorrate"
          summary: "Over 5% of requests are returning 5xx"
          description: "{{ $value | humanizePercentage }} of requests over the last 5m."

      - alert: AGLedgerHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(agledger_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        # Same reason as AGLedgerHighErrorRate: a p95 that dips under 2s for one
        # evaluation during a rollout should not close and reopen the alert.
        keep_firing_for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerhighlatency"
          summary: "P95 request latency is above 2s"
          description: "P95 is {{ $value | printf \"%.2f\" }}s."

      - alert: AGLedgerDbPoolSaturated
        # Waiting connections mean requests are queued behind the pool. This is
        # the shape a pool deadlock takes from the outside.
        #
        # Read per series on purpose, with no aggregation. Every process owns
        # its own pool and this gauge is that pool's own waiter count, so one
        # saturated replica is one saturated replica: summing would hide which,
        # and would make a threshold that means "this process is blocked" into
        # a number that grows with the replica count.
        #
        # "Every process" includes the worker, and only because the worker
        # publishes these three gauges itself. They are set inside the Fastify
        # metrics plugin, which the worker never runs, so its series came from
        # the import alone: unlabelled gauges materialize at 0 at registration
        # and the worker's /metrics served that 0 forever. The worker's pool is
        # the one the maintenance sweeps, the gate worker and the delivery
        # workers contend for, so the per-series reading was true of the API
        # replicas and silent on the likeliest saturation of the two.
        expr: agledger_db_pool_waiting_connections > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerdbpoolsaturated"
          summary: "Requests are queued waiting for a database connection"
          description: >-
            {{ $value | printf "%.0f" }} waiter(s) for 5m. Sustained waiting is either an
            undersized pool or a query holding a client across an await.

      - alert: AGLedgerDbConnectionsDropping
        # Backends dying under checked-out clients. Each one now rejects the
        # in-flight query and evicts the client rather than killing the process,
        # so this counter is the only thing that reports it; before the client
        # error listener existed the signal was a container restart.
        #
        # A failover is a burst that stops, and the `for:` hold rides over it.
        # What this catches is the state that does not stop: a flapping network
        # path to an external database, an OOM-killer cycling the Postgres
        # process, or something terminating backends on a timer. Every trip
        # costs the transaction that was open, which for a pg-boss job is a
        # retry and for a request is a 503 /problems/database-unavailable (a
        # terminated backend is 57P01 or the driver's `Connection terminated`,
        # both of which the API classifies rather than answering 500).
        #
        # Counts roughly double: one backend death raises both the FATAL
        # message and the socket close.
        expr: sum(rate(agledger_db_client_connection_errors_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerdbconnectionsdropping"
          summary: "Database connections are being dropped under active clients"
          description: >-
            Backends have been dying under checked-out clients for 10m. Check the database
            for restarts, failovers and OOM kills, and the network path if the database is
            external. Open transactions are lost each time.

      - alert: AGLedgerQueueBacklogGrowing
        # max, not sum, for the same reason as AGLedgerApiKeyExpiringTomorrow
        # below. Only the API process publishes this gauge, and every API
        # replica asks pg-boss for the same shared queue's depth on the same
        # 15-second refresh, so each one republishes the whole install's
        # backlog rather than a share of it. Summing multiplies it by
        # `api.replicaCount`: two replicas watching a healthy 600-job queue
        # would report 1200 and page.
        #
        # `ready`, not `queued`: queued also counts jobs deferred on a retry
        # backoff, which a dead webhook receiver parks by the thousand and no
        # added worker can run any sooner.
        expr: max by (queue) (agledger_pgboss_queue_size{state="ready"}) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerqueuebackloggrowing"
          summary: "Queue {{ $labels.queue }} has a growing backlog"
          description: >-
            {{ $value | printf "%.0f" }} jobs ready to run and not taken for 15m. Either the
            worker is down or it cannot keep up.

      - alert: AGLedgerWorkerJobsFailing
        expr: |
          sum(rate(agledger_worker_jobs_processed_total{status="failure"}[10m]))
          / clamp_min(sum(rate(agledger_worker_jobs_processed_total[10m])), 0.001) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerworkerjobsfailing"
          summary: "Over 10% of worker jobs are failing"
          description: "{{ $value | humanizePercentage }} of jobs over the last 10m."

      - alert: AGLedgerMaintenanceSweepFailing
        # The rule above cannot see this. The maintenance queue multiplexes
        # about twenty periodic sweeps, and one failing every cycle is a small
        # fraction of a busy worker's jobs: on a minute-cadence sweep that is
        # 60 failures an hour against everything else the worker did, which
        # never reaches the 10% ratio. The `task` label is what makes one
        # broken sweep visible, and it exists only on this counter.
        #
        # Two in three hours, not one: pg-boss retries, and a single sweep that
        # failed on a transient pool error and succeeded on the retry is not an
        # operator's problem. Twice is a sweep that is not getting through.
        #
        # Summed over the task, for the same reason as the rule below. One cron
        # tick is one job and any worker replica may take it, and pg-boss is
        # free to hand the retry to a different replica than the attempt. Two
        # failed cycles of one sweep landing on two pods is still a sweep that
        # failed twice, and a bare `increase()` counts one on each series and
        # stays silent. This is also the query the runbook tells a responder to
        # run, and the two have to agree.
        expr: sum by (task) (increase(agledger_maintenance_sweep_failures_total[3h])) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgermaintenancesweepfailing"
          summary: "Maintenance sweep {{ $labels.task }} keeps failing"
          description: >-
            {{ $value | printf "%.0f" }} failed cycle(s) of the {{ $labels.task }} sweep in
            the last 3h. What that costs depends on the task: a cleanup sweep leaves its
            table growing, a recovery sweep leaves records waiting on it, and the vault
            checkpoint sweep leaves the chain unanchored. Check the worker log for the
            throw, then agledger_maintenance_sweep_rows_total for the same task to see
            whether any cycle is getting through.

      - alert: AGLedgerExpiryRollupFailing
        # The expiry sweep rolls each FAILED child past its deadline up onto its
        # ACTIVE parent (failing it, or expiring it past its own deadline), and
        # catches each parent's failure so one parent cannot hold back the rest:
        # the sweep completes, so the rule above never sees it. Two in three
        # hours, as there: a parent that threw once on a transient error and was
        # rolled up on the next cycle is not an operator's problem.
        expr: increase(agledger_expiry_lapsed_failed_child_rollup_failures_total[3h]) >= 2
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerexpiryrollupfailing"
          summary: "The expiry sweep cannot roll lapsed FAILED children up onto their parents"
          description: >-
            {{ $value | printf "%.0f" }} failed attempt(s) in the last 3h to roll a FAILED child
            past its deadline up onto its ACTIVE parent. Those parents stay ACTIVE. The worker
            log names each record id ("Expiry sweep: rolling a FAILED child past its deadline
            up onto its parent threw").

      - alert: AGLedgerMaintenanceSweepFallingBehind
        # The failure rule above cannot see this, and neither can the row
        # counter. A sweep that bounds its own work by a clock can finish every
        # cycle successfully, delete more rows than it has ever deleted, and
        # still be losing: the cycle where a cleanup falls behind a sustained
        # rate is the cycle where its row count peaks. `behind` is the sweep's
        # own answer to "was there work left when I stopped", and it is
        # zero-incremented on the cycles that drained, so this series exists on
        # a healthy install and `increase` over it reads as a real zero.
        #
        # Six in an hour, against the twelve cycles the 5-minute
        # oidc-jti-cleanup schedule gives (idempotency-cleanup runs on the
        # same one): half the hour spent behind. A burst
        # that takes two or three cycles to drain is the mechanism working, and
        # paging on it would page on every spike of admin authentication. The
        # threshold counts cycles, so a sweep added later on a different
        # cadence needs its own rule rather than a share of this one.
        #
        # Summed over the task, NOT read per series, because one cron tick
        # produces one job and any worker replica may take it. Bare
        # `increase()` counts per `instance`, so the hour's twelve cycles land
        # on as many series as there are replicas, and "half the hour" becomes
        # "half the hour on one pod": at three replicas taking four cycles
        # each, every cycle in the hour can be behind and no series reaches
        # six. A pod rescheduled onto a new IP mid-window splits the count the
        # same way. This is also the query the runbook tells a responder to
        # run, and the two have to agree.
        #
        # vault-checkpoints is excluded: a chain it did not reach has entries
        # with no checkpoint, not dead rows, so it has its own rule below.
        expr: sum by (task) (increase(agledger_maintenance_sweep_behind_total{task!="vault-checkpoints"}[1h])) >= 6
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgermaintenancesweepfallingbehind"
          summary: "Maintenance sweep {{ $labels.task }} is not keeping up"
          description: >-
            {{ $value | printf "%.0f" }} cycle(s) of the {{ $labels.task }} sweep in the last
            hour ended with rows still waiting. Nothing is failing and nothing is lost: the
            sweep deletes rows that are already dead, so the cost is table size and index
            bloat on the table it cleans, and it catches up on its own once the rate that
            feeds it drops. Check agledger_maintenance_sweep_rows_total and
            agledger_maintenance_sweep_duration_seconds for the same task to see whether the
            cycles are hitting their time budget or the database has slowed down.

      - alert: AGLedgerVaultCheckpointsFallingBehind
        # A checkpoint run stops on its time budget before the end of `records`
        # and the next run on that worker goes on from there, so a backlog is
        # worked through across runs. One run ending short is that mechanism
        # working. Every run for thirteen hours ending short is a Server writing
        # chains faster than it checkpoints them: at the default six-hour
        # cadence that is two or three runs in a row, and at a five-minute one
        # over a hundred and fifty. At a cadence over thirteen hours
        # (VAULT_ANCHOR_INTERVAL_MINUTES above 780) the window can hold no run
        # at all and the rule cannot see it.
        #
        # Every run, not any run: the behind counter is compared with the runs
        # the duration histogram counted for the same task, since `increase` on
        # the behind counter alone stays up for the whole window after the last
        # short run. Both are summed over replicas for the reason the rule
        # above gives, and a run that threw counts as a run that did not fall
        # behind (AGLedgerMaintenanceSweepFailing reports it). The 0.99 absorbs
        # `increase` not extrapolating a counter back past zero, which parts the
        # two sums by about one scrape interval over thirteen hours when the
        # behind counter starts the window at zero.
        expr: |
          sum(increase(agledger_maintenance_sweep_behind_total{task="vault-checkpoints"}[13h])) >= 1
          and
          sum(increase(agledger_maintenance_sweep_behind_total{task="vault-checkpoints"}[13h]))
            >= 0.99 * sum(increase(agledger_maintenance_sweep_duration_seconds_count{task="vault-checkpoints"}[13h]))
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgervaultcheckpointsfallingbehind"
          summary: "Every vault checkpoint run for thirteen hours stopped before reaching every chain"
          description: >-
            Every vault-checkpoints run in the last thirteen hours spent its time budget
            before reaching the end of the records table. Chains past where each run
            stopped have entries with no signed checkpoint and, with anchoring on, no
            external anchor yet, so the tamper-exposure window is longer than
            VAULT_ANCHOR_INTERVAL_MINUTES.

      - alert: AGLedgerApiKeyExpiringTomorrow
        # The 24h window, not the 7d one. On an install that sets
        # API_KEY_MAX_LIFETIME_SECONDS, keys inside a 7-day window are the
        # steady state rather than an event: a 90-day cap over twenty keys puts
        # roughly one in the window at all times, so `7d > 0` would be a warning
        # that never clears on exactly the installs that adopted the control.
        # A key that stops authenticating tomorrow is an event on any install.
        #
        # max, not sum: only the API process publishes this gauge, and every API
        # replica publishes the same table. Adding them would multiply by the
        # replica count.
        expr: max(agledger_api_keys_expiring_soon{window="24h"}) > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerapikeyexpiringtomorrow"
          summary: "{{ $value | printf \"%.0f\" }} active API keys expire within 24 hours"
          description: >-
            An expired key stops authenticating with no warning to its holder, and the failure
            surfaces as the agent it belonged to going quiet. To list them, GET
            /v1/admin/api-keys?isActive=true with expiresBefore set to tomorrow; note that
            filter has no lower bound, so it also returns keys that expired earlier. No admin
            route rotates a key the caller does not hold: mint the replacement for the same
            owner with POST /v1/admin/api-keys, then revoke the old one with PATCH
            /v1/admin/api-keys/{keyId}. POST /v1/auth/keys/rotate does not renew: it replaces the
            CALLER's own secret and keeps its expiry.

  # ---------------------------------------------------------------------------
  # Target liveness and process health. Every other group in this file reads a
  # value some process published, so none of them can see a process that is not
  # there at all: a stopped Server publishes nothing, and an empty query result
  # is what a healthy quiet install looks like too.
  #
  # `up == 0` is not enough on its own. Neither packaged install keeps a stopped
  # process in the target list. The bundled Compose stack discovers both services
  # by DNS, and a stopped one stops resolving; on Kubernetes the chart's
  # ServiceMonitor becomes operator-generated `kubernetes_sd_configs` over
  # endpoints, and a stopped pod leaves the endpoint set. Either way Prometheus
  # drops the target, `up` goes ABSENT rather than to 0, and the scrape-failure
  # rule below sees nothing. `absent()` on a series only one process can publish
  # is what covers that, and the two rules are complementary rather than
  # redundant: `up == 0` catches a process that answers the socket and fails the
  # scrape, `absent()` catches one that is gone.
  #
  # No `job=` selector anywhere in this group. On Kubernetes the job label is the
  # release's Service name, so no fixed value matches. The processes are told
  # apart by a series only one of them registers:
  #
  #   - agledger_phase2_enqueue_failures_total is declared by the
  #     completion-accepted event handler, which only the API server loads.
  #   - agledger_partition_gauges_updated_timestamp_seconds is declared by the
  #     worker entrypoint, which nothing on the API path loads.
  #
  # Both are unlabelled, and @prometheus-io/client materializes an unlabelled
  # counter or gauge at registration time, so each is present on its own
  # process's first scrape and on no scrape of the other. A labelled metric would
  # not work here: it has no series until its first increment.
  # ---------------------------------------------------------------------------
  - name: agledger-targets
    rules:
      - alert: AGLedgerApiTargetAbsent
        expr: absent(agledger_phase2_enqueue_failures_total)
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerapitargetabsent"
          summary: "No AGLedger API process is being scraped"
          description: >-
            Nothing has published an API-only series for 5 minutes. On both packaged installs
            a stopped API disappears from the target list instead of reporting up == 0, so
            AGLedgerScrapeFailing stays silent and this is the only rule that sees it. Either
            every API replica is down, or Prometheus can no longer resolve or authenticate to
            them. Check the process first, then the scrape config and METRICS_AUTH_TOKEN.

      - alert: AGLedgerWorkerTargetAbsent
        expr: absent(agledger_partition_gauges_updated_timestamp_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerworkertargetabsent"
          summary: "No AGLedger worker process is being scraped"
          description: >-
            Nothing has published a worker-only series for 5 minutes. On both packaged installs
            a stopped worker disappears from the target list instead of reporting up == 0, so
            AGLedgerScrapeFailing stays silent and this is the only rule that sees it. With no
            worker, gate evaluation, webhook delivery, record expiry, partition maintenance and
            every recovery sweep have stopped, and the API keeps returning 200 the whole time.

      - alert: AGLedgerScrapeFailing
        # The other half of the two absent() rules above: a target Prometheus
        # still has, whose scrape does not succeed. A refused /metrics counts,
        # and so does a scrape that trips `sample_limit`, which Prometheus
        # reports as a failed scrape with the target still present.
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerscrapefailing"
          summary: "Prometheus cannot scrape {{ $labels.instance }}"
          description: >-
            The target {{ $labels.instance }} in job {{ $labels.job }} has failed its scrape
            for 5 minutes. Every rule in this file that reads a metric from it is now
            evaluating stale or absent data. Common causes: the process is refusing
            /metrics (METRICS_AUTH_REQUIRED with no METRICS_AUTH_TOKEN makes the worker
            answer 503 by design), the scrape token does not match, or the scrape tripped
            `sample_limit` and Prometheus discarded the whole payload.

      - alert: AGLedgerProcessRestarting
        # Three starts in an hour is past anything a rollout explains on a
        # stable install. The gauge is the process start time, so `changes()`
        # counts restarts directly rather than inferring them from a counter
        # reset.
        #
        # Per series, not aggregated: a restart loop is a property of one
        # process, and the summary names the instance the responder has to
        # look at. The cost is that a Kubernetes pod which comes back on a new
        # IP arrives as a new series with no history, so what this catches on
        # that platform is a container restarting in place. The two absent()
        # rules above are what see the pod that is gone entirely.
        expr: changes(agledger_process_start_time_seconds[1h]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgerprocessrestarting"
          summary: "{{ $labels.instance }} has restarted {{ $value | printf \"%.0f\" }} times in an hour"
          description: >-
            A restart loop discards whatever was in flight each time: an open transaction
            rolls back, a pg-boss job goes back for retry, and in-memory rate-limit state
            starts over. It also resets every counter in this file, which makes the
            increase() windows elsewhere read low. Check the container exit reason and the
            process log for a boot failure or an OOM kill.

      - alert: AGLedgerEventLoopLagging
        # Saturation ahead of symptom. Node is single-threaded, so a p99 event
        # loop lag of half a second means work is queued behind the loop before
        # any of it shows up as request latency, and AGLedgerHighLatency needs
        # the p95 of completed requests to move before it can say anything.
        expr: agledger_nodejs_eventloop_lag_p99_seconds > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/AGLedger-ai/install/blob/main/monitoring/runbooks.md#agledgereventlooplagging"
          summary: "Event loop p99 lag on {{ $labels.instance }} is above 0.5s"
          description: >-
            {{ $value | printf "%.2f" }}s of p99 event loop lag for 10 minutes on
            {{ $labels.instance }}. This process is saturated: every request on it is
            waiting behind the loop, and that will reach p95 latency before it reaches
            errors. Usual causes are CPU starvation from the container limit, a large
            synchronous JSON body, or a gate rule doing heavy regex work.
