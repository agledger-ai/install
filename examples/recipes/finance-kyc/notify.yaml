# Finance / KYC vertical recipe: Notify (webhook) subscriptions.
# A declarative list of the webhook subscriptions this recipe expects. Create each
# one against your Server with POST /v1/webhooks (see the Webhooks guide). The
# signing secret is returned ONCE at create time, so capture it then; it is null on
# every subsequent read. The same subscriptions can be provisioned as config-as-code
# instead: deploy/examples/provisioning/webhooks/example.yaml carries eventTypes and
# recordTypes under those same names.
#
# The two notice legs are DELIBERATELY routed to different audiences. That is the
# structural point of the vertical:
#   - the regulator channel carries the SAR / OFAC blocking report (the inverted KYC notice),
#   - the customer channel carries the ECOA+FCRA adverse-action notice (the credit mirror).
#
# IMPORTANT: keep SAR events off the applicant's channel, and use recordTypes to do
# it. A subscription filters on two axes. eventTypes selects the lifecycle events
# (record.created, record.fulfilled, and so on); recordTypes selects the contract
# types whose record-scoped events this subscription may receive. A subscription
# that lists recordTypes NEVER receives a record event for a type it does not list.
# The Server applies that filter when it resolves subscriptions for the event, so it
# holds whatever the receiver does with the payload. The applicant channel below
# lists only keystone-adverse-action-notice-v1, and that is the mechanism keeping
# keystone-regulatory-report-v1 off it: forwarding a SAR record.created to the
# subject is "tipping off" (31 U.S.C. 5318(g)(2), a federal crime). Omitting
# recordTypes, or setting ['*'], subscribes to every contract type, so never leave a
# subject-facing channel untyped. Entries are not checked against the schema
# registry, so a subscription may name a type before that type is registered.
#
# SSRF: private / link-local / metadata IPs are blocked at connect regardless of
# DNS; SSRF_ALLOW_CIDRS is the only escape hatch. Point each url at a public HTTPS
# endpoint you control (or HTTP only on an LB-terminated-TLS install with
# SSRF_ALLOW_PLAIN_HTTP set). Replace the example.com URLs with your own.
subscriptions:
  # Compliance / screening operations: every business-meaningful onboarding moment.
  # No recordTypes here, so this channel receives every contract type in the recipe,
  # the regulatory report included. It is staffed by compliance, which is entitled
  # to see that report. Narrow it with recordTypes if yours is not.
  - name: compliance-ops
    url: https://kyc-events.example.com/agledger
    signingAlg: hmac          # or ed25519 for vault-signed, offline-verifiable deliveries
    eventTypes:
      - record.created            # an onboarding/screening step opened
      - record.gate_complete      # an engine/principal verdict rendered (score band or human decision)
      - record.fulfilled          # auto-clear, or a sealed L1/L2 verdict
      - record.failed             # score above the clear threshold -> escalate to a human analyst
      - signal.emitted            # terminal compliance signal fired
  # Regulator channel: the INVERTED notice. SAR -> FinCEN / blocking report -> OFAC.
  # Never the subject.
  - name: regulator-reports
    url: https://regulator-intake.example.com/agledger
    signingAlg: ed25519           # durable, offline-verifiable signed proof for the examiner
    eventTypes:
      - record.created
      - record.reference_added
    recordTypes:
      - keystone-regulatory-report-v1   # the only type delivered to this channel
  # Customer channel: the credit-mirror ECOA+FCRA adverse-action notice TO the applicant.
  - name: applicant-notices
    url: https://applicant-notices.example.com/agledger
    signingAlg: hmac
    eventTypes:
      - record.created
    recordTypes:
      - keystone-adverse-action-notice-v1   # a SAR record.created can never reach this url
