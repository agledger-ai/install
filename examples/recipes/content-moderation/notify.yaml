# Content-moderation vertical recipe: Notify (webhook) subscriptions.
# A declarative list of the webhook subscriptions this recipe expects. Create each
# one against your Server with POST /v1/webhooks (see the Webhooks guide). The
# signing secret is returned ONCE at create time, so capture it then; it is null on
# every subsequent read. The same subscriptions can be provisioned as config-as-code
# instead: deploy/examples/provisioning/webhooks/example.yaml carries eventTypes and
# recordTypes under those same names.
#
# SSRF: private / link-local / metadata IPs are blocked at connect regardless of
# DNS; SSRF_ALLOW_CIDRS is the only escape hatch. Point each url at a public HTTPS
# endpoint you control (or HTTP only on an LB-terminated-TLS install with
# SSRF_ALLOW_PLAIN_HTTP set). Replace the example.com URLs with your own.
#
# A subscription filters on two axes. eventTypes selects the lifecycle events;
# recordTypes selects the contract types whose record-scoped events it may receive.
# A subscription that lists recordTypes NEVER receives a record event for a type it
# does not list, and the Server applies that filter when it resolves subscriptions
# for the event. That is what keeps the transparency / appeal channel below to the
# two regulator-facing types rather than the whole enforcement stream. Omitting
# recordTypes, or setting ['*'], subscribes to every contract type.
subscriptions:
  # The moderation operations channel: the enforcement lifecycle, covering the
  # inbound flag, the gated enforcement decision, and the statement issued to the
  # user. No recordTypes, so it receives every type in the recipe.
  - name: moderation-ops
    url: https://moderation-events.example.com/agledger
    signingAlg: hmac          # or ed25519 for vault-signed, offline-verifiable deliveries
    eventTypes:
      - record.created               # a flag received, or an enforcement decision opened
      - record.completion_submitted  # a moderator submitted a determination
      - record.gate_complete         # a lead/reviewer rendered accept/reject
      - record.fulfilled             # an enforcement decision or appeal authorized
      - record.failed                # an incomplete determination rejected
      - signal.emitted               # terminal signal fired
  # Transparency / appeal channel: the regulator-facing and appeal records, routed to
  # the compliance queue. recordTypes pins it to dsa-transparency-submission-v1 (the
  # Art.24(5) submission and receipt) and appeal-redetermination-decision-v1 (the
  # Art.20 verdict, decided independently). Nothing else on the chain is delivered
  # here.
  - name: transparency-and-appeals
    url: https://compliance-queue.example.com/agledger
    signingAlg: ed25519       # vault-signed, offline-verifiable, for a regulator-facing audit trail
    eventTypes:
      - record.created
      - record.gate_complete
      - record.fulfilled
    recordTypes:
      - dsa-transparency-submission-v1
      - appeal-redetermination-decision-v1
