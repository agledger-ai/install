name: pharmagxp
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  odoo:
    image: odoo:18.0
    depends_on: [db]
    ports:
      - "127.0.0.1:18069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./oca-manufacture:/mnt/extra-addons:ro
      - odoodata:/var/lib/odoo
volumes:
  pgdata:
  odoodata:
